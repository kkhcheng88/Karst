name: Publish research reader

on:
  push:
    branches: [master]
    paths:
      - 'cards/reader/**'
      - 'karst/reader/**'
      - 'karst/tests/test_reader.py'
      - 'karst/tests/test_reader_v2.py'
      - '.github/workflows/reader-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reader-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check public export and history
        run: |
          python -m pip install . matplotlib==3.10.9
          python -m unittest karst.tests.test_reader karst.tests.test_reader_v2 -v
      - name: Build human-facing pages only
        run: python -m karst.reader --content cards/reader --output _reader_site
      - name: Upload allowlisted output
        uses: actions/upload-pages-artifact@v4
        with:
          path: _reader_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        uses: actions/configure-pages@v5
      - name: Publish reading site
        id: deployment
        uses: actions/deploy-pages@v4
