# Karst 裁判第二把尺 —— milestone-Brier 預測庫(Fable 交接 D7 / P0-2)。
# 現行裁判 forward_ic.py 用 63d 橫截面 IC,有效闊度 = 主題數(同主題 ticker 共用 confidence),
# 且 63d horizon 同 1-3 年 thesis 錯配。呢個檔補 horizon-matched 校準:每個 active theme 2-4 條
# 具名、有期限、可客觀判 true/false 嘅預測 + 系統機率。到期 -> 夜班/週度 job 判 outcome ->
# brier.py 滾動計分,答「系統話 0.7 嘅嘢係咪真係 70% 中」。
#
# probability 語義:P(claim 到期判 TRUE)。outcome=1 代表 claim 成真、0 代表唔成真;
# Brier = mean((probability - outcome)^2)。錨定原則見 meta.method。
# 兩把尺分工:IC = 市場驗證(價格有冇郁);Brier = 敘事校準(系統嘅機率準唔準)。互補,唔互相取代。
meta:
  created: '2026-07-13'
  method: >-
    probability 錨定 theme confidence 作為「投資值博率」先驗,再按 claim 性質調整:
    (a) 近期營運延續型(lead-time/sold-out/backlog 延續)-> 高機率 0.65-0.90,因強物理證據正正係
    theme 存在理由,低 confidence 反映嘅係估值/擁擠風險而非近期營運風險;
    (b) kill-trigger 一律用「反面壞事發生」表述 -> 低機率 0.08-0.35,測系統低機率校準;
    (c) 純 binary catalyst(發射/監管/地緣 deal)-> base-rate 中間機率 0.30-0.60。
    confidence 越低嘅 theme,延續機率相應下調、kill 機率上調。deadline 全部係字串(brier.py 自行 parse)。
  brier_convention: 'outcome: 1=claim成真, 0=唔成真; probability=P(TRUE); 每 theme + 全局各出一個滾動 Brier'
  themes_covered: 15

milestones:

