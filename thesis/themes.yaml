# Karst thesis registry — the machine-readable bridge spine/providers.thesis_quality reads.
# Maps tickers -> their theme verdict. Each theme has a wiki page (thesis/wiki/<slug>.md) holding
# the 4-KPI evidence + citations. confidence is an INITIAL, UNCALIBRATED estimate (cold start; no
# track record yet) -> it becomes a real probability only after track_record calibration (DESIGN §6).
# Do NOT read confidence as precise; read it as disciplined relative strength x cycle temperature.
#
# 2026-07-11 CHINA CAVEAT (user-confirmed, from Chancellor "Capital Returns" ch.6 distillation,
# docs/2026-07-11_magnifier_book_capital_returns.md §2.4): any candidate ticker that IS ITSELF a
# China-domiciled / China-state-linked entity (NOT merely "sells into China" or "benefits from
# China policy" — e.g. FSLR/rare-earth-materials tickers here are fine, they are US-based) needs
# elevated skepticism before admission at normal confidence: China's domestic bank-debt-forgiveness
# mechanism disables the normal "capacity exit -> supply discipline restored" signal our
# constraint-language methodology assumes; apparent margin/discipline inflections can be
# IPO-window/carve-out/government-pricing artifacts that mimic a real kill-feature reversal without
# being economically real (Chancellor's own bearish call on PICC was wrong, +637%, precisely because
# a red flag != a sell signal for these names). Applies to NONE of the 15 tickers below as of
# 2026-07-11 (none are China-domiciled/state-linked) -- this is a standing admission principle for
# FUTURE candidates (discovery radar / magnifier), not a retroactive edit.

# META_FACTOR TAXONOMY REGISTRY (formalized 2026-07-12; see docs/2026-07-08_phase3_ws3_lifecycle.md
# §1a for the full concept doc). A meta_factor tags the underlying MACRO DRIVER a theme's thesis
# depends on -- NOT its sector/ticker. Purpose: themes that look diversified by ticker/sector can
# still be the SAME bet if they share a meta_factor (concentration.py measures this; a shared
# meta_factor with >=2 themes SHOULD have a cross-theme concept wiki page, e.g. ai-capex ->
# thesis/wiki/ai-capex-macro-risk.md, cross-linked from every member theme's kill_condition).
# Naming: kebab-case, must match a value below EXACTLY (thesis/lint.py warns on unrecognized
# values) -- new values may be coined at admission time but MUST be added to this registry in the
# SAME edit, no silent free-typing (this list drifting out of sync with themes.yaml is exactly the
# bug this registry exists to prevent -- see the 2026-07-11 euv-lithography-monopoly incident,
# fixed 2026-07-12, where a new theme was tagged ai-capex but never cross-linked into the hub page).
# EVERY value below must pass the "one-sentence causal test" (WS3 §1a rule 0): can you write "if
# [specific macro event X] happens, every theme tagged this factor fails for THE SAME reason"? If
# not, the tag is too broad and must be split -- see the 2026-07-12 energy-macro incident below,
# where a naive sector-label tag (three unrelated death-causes: oil price / US tariffs / LNG
# buildout) was caught and split by this exact test after a user challenge.
#   ai-capex             (9 themes, 54.9% confidence-weight, hub: thesis/wiki/ai-capex-macro-risk.md)
#                          -- grew from 7/48.0% on 2026-07-12 after oil-gas-energy's AND
#                          gas-compression-equipment's AI-gas-power leg each passed the causal test
#                          and got a 2nd tag added (energy-macro kept alongside, NOT replaced --
#                          both themes have genuinely distinct real drivers, see energy-macro below).
#                          **54.9% > the spec Sec4 50% cap -- concentration.py now emits an EXCESS
#                          WARNING that did NOT fire before the retag (48% looked fine; it wasn't).**
#   china-supply         (2 themes, hub: thesis/wiki/china-supply-macro-risk.md (written 2026-07-13,
#                          Fable 交接書 P2-13) -- rare-earth-materials + us-solar-manufacturing,
#                          added 2026-07-12 after us-solar-manufacturing's tellurium-export-control
#                          leg passed the causal test better than its old energy-macro tag; hub also
#                          aggregates the MP capex/D&A warning (2026-07-13, rebutted as a P2 signal --
#                          see results/2026-07-13_mp_capex_da_review.md) and AXTI's China-manufacturing
#                          dual-exposure (photonics-optical, tagged ai-capex not china-supply -- a
#                          labeling gap the hub flags, does not silently fix)
#   energy-macro         (2 themes, hub: MISSING -- oil-gas-energy(oil-price leg only after the
#                          2026-07-12 split) + gas-compression-equipment(LNG-export/Permian-gas legs,
#                          AI-gas-power leg moved to ai-capex above); STILL at the >=2 hub-page
#                          threshold post-split -- flagged backlog. NOTE: this 2-member cluster is a
#                          borderline causal-test case (oil price vs. LNG-export volume are related
#                          but not obviously the SAME single trigger) -- weaker than ai-capex's
#                          clean pass, worth re-examining when the hub page eventually gets written)
#   policy-defense       (1 theme -- no hub required yet, single-theme)
#   pharma-manufacturing (1 theme -- no hub required yet, single-theme; label is broad, re-test
#                          with rule 0 if a 2nd theme is ever proposed for it)
#   aerospace-capex      (1 theme -- no hub required yet, single-theme)
#   building-products    (1 theme -- no hub required yet, single-theme)
#   trade-policy         (1 theme -- us-solar-manufacturing, US tariff/IRA policy specifically)
#   rates-duration       (RESERVED, unused -- pre-registered in original 2026-07-08 spec for a
#                          future duration/REIT-sensitive thesis; do not repurpose this name)
#   consumer             (RESERVED, unused -- pre-registered in original 2026-07-08 spec for a
#                          future discretionary-spending thesis; do not repurpose this name)

