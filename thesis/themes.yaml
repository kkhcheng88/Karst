# Karst thesis registry — the machine-readable bridge spine/providers.thesis_quality reads.
# Maps tickers -> their theme verdict. Each theme has a wiki page (thesis/wiki/<slug>.md) holding
# the 4-KPI evidence + citations. confidence is an INITIAL, UNCALIBRATED estimate (cold start; no
# track record yet) -> it becomes a real probability only after track_record calibration (DESIGN §6).
# Do NOT read confidence as precise; read it as disciplined relative strength x cycle temperature.

themes:
  memory-supercycle:
    wiki: thesis/wiki/memory-supercycle.md
    type: B                    # B = thematic supercycle (supply-constrained + demand + pricing power)
    cycle_stage: late          # MU capex 2.66x (supply-response top signal) + SK Hynix 2034 3x + peak-earnings
    confidence: 0.38           # LATE (capex top signal) BUT LTA de-cyclicalisation cushions the floor. INITIAL.
    verdict: real-but-late-cushioned
    kill_condition: >-
      LTA/SCA scorecard stalls or reverses (contract prices roll over OR net-new LTA signings stall,
      i.e. de-cyclicalisation stops being confirmed by financials) OR HBM / advanced-packaging capacity
      ramps AHEAD of AI-inference demand (glut). Trigger -> confidence to zero, back to classic cyclical top.
    tickers: [MU, SNDK, WDC, DRAM]
    note: "late (capex 2.66x top signal) but LTA take-or-pay/RPO cushions downside; small size + watch LTA scorecard, don't chase."
