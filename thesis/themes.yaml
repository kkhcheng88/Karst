      僅 CBO 願景、已到位僅 $250B)或純玩家獲利遲不轉正;個股定日 kill:RKLB Neutron 2026Q4 再延、ASTS 2026H2 衛星未準時足量上天、GSAT Amazon
      併購 FCC 破局。觸發→confidence 歸零、mean-revert。
    tickers:
    - RKLB
    - ASTS
    - KTOS
    - HEI
    - LOAR
    - RDW
    - LUNR
    - BKSY
    - PL
    - GSAT
    note: Type-B 太空 capex 早週期主題(發射成本 -95%、Starlink 已證 $11.387B/63% EBITDA、VC $36B/季、Golden Dome $1.2T)。語料自律(6
      篇僅 1 bull=17%)但可交易表達重度 priced-in:ASTS 377x/RKLB 94x P/S 夢想定價、HEI ttm_pe 87 分位/MP 92 分位站頂、多檔 pre-revenue(RKLB/ASTS/RDW/PL/BKSY
      會計虧損)、最深護城河 SpaceX 不可乾淨買。唯一 bull(LOAR)空曝險最薄=航太 roll-up 非太空表達。base 4.5/8=0.5625 × cycle/crowding penalty
      ~0.50 → 0.28,略低於 photonics 0.30(太空缺可乾淨買的硬瓶頸深護城河)。表達用選項/事件框架、小注、嚴守 kill。INITIAL/uncalibrated。

