    wiki: thesis/wiki/ai-power-grid.md
    type: B
    cycle_stage: late
    confidence: 0.33
    verdict: real-demand-but-priced-ahead-of-ramp
    kill_condition: 'AI-capex demand anchor breaks (hyperscaler / data-center capex guidance rolls over
      off the $1T->$1.7T path) OR 800V/HVDC native mass-production (SemiAnalysis stages 3-4) slips again
      / 48V+pluggable stays good-enough (onsemi''s ~10x rack-content fails to materialise, #114/#125) OR
      turbine majors'' orders confirm a 2026 peak (GEV CEO order-pace cracks #086, #134) OR the Infineon
      price-hike cycle reverses (power-semi shortage ends). Trigger -> confidence to zero; 90th-pctile quality
      names (ETN 99% / ON 90% / MPWR 89%) mean-revert, pre-earnings names (BE/NVTS/WOLF) crash.'
    tickers:
    - GEV
    - BE
    - VRT
    - ETN
    - PWR
    - MPWR
    - VICR
    - NVTS
    - WOLF
    - 'ON'
    note: 'Real demand bottleneck (near-unambiguous: Friedberg ''100% power constrained'', $700B hyperscaler
      capex, EQT CEO''s 8 Homer City inquiries, onsemi 10x rack content) but priced AHEAD of the 2027 volume
      ramp. Report-crowding LOW (29% bull < photonics 58%) yet quality names at valuation extremes (ETN
      99th / ON 90th / MPWR 89th / BE 91st ttm_pe pctile) + insider selling + analyst PTs below price (NVTS
      $13.59 vs $28.51). Moat diluted by commodity gas/utility segments. Don''t chase; cleanest cheap expression
      = EQT (35th pctile, capex flat); deepest moat = MPWR/VICR POL duopoly but wait for valuation to deflate;
      BE/NVTS/WOLF pre-earnings -> option/event framing. NVDA/CRWV/NBIS = downstream demand, excluded.'

  advanced-packaging:
    wiki: thesis/wiki/advanced-packaging.md
    type: B
    cycle_stage: late
    confidence: 0.32
    verdict: real-chokepoint-but-proxies-priced
    kill_condition: 'Upstream material bottleneck loosens — Nittobo T-glass / Mitsui HVLP copper-foil 2027-28
      new capacity arrives early, or Q-glass/next-gen de-monopolises T-glass (#106/#117); OR the packaging
      format war resolves to a single winner, draining the AMKR/ASX ''whoever-wins-gets-paid'' arms-dealer
      premium (#131); OR CoWoS/EMIB capacity ramps ahead of AI-accelerator demand (chokepoint -> glut, #100);
      OR tradeable proxies (AMKR/TTMI/MKSI) de-rate from their 90-100th ttm_pe percentiles. Trigger -> confidence
      to zero.'
    tickers:
    - AMKR
    - ASX
    - TTMI
    - INTC
    - MKSI
    - KLAC
    - GLW
    - STX
    - WDC
    note: real physical chokepoint (packaging + T-glass ~90% Nittobo / HVLP-copper quota material double-lock)
      but the real bottleneck owners (Nittobo/Mitsui/Hoya) are NON-US; every tradeable US proxy sits at
      90-100th ttm_pe pctile (TTMI 96/MKSI 94/KLAC 94/AMKR 91/ASX 90), INTC PE meaningless->option. Narrative
      only 1/9=11% bull (less crowded than memory) but valuation + expression-gap dominate. Prefer arms-dealers
      AMKR/ASX (whoever wins gets paid) > priciest toll-booth TTMI; INTC event/option framing; TSM is the
      eroded incumbent (not a long). Don't chase; wait for proxy valuations to deflate.

