[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "karst"
version = "0.1.0"
description = "Karst 單一定義庫:因子定義、實體與代號歷史、因子值、數據快照登記"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    # 回測核心(D-011)。numba/numpy 的下限跟 KARST-009 對決實測過的那一套,
    # 低過這個版本 vectorbt 1.1.0 的 numba 核心編譯不起。
    "vectorbt>=1.1.0",
    "numba>=0.67.0",
    "numpy>=2.4.6",
    # 行情與交易日曆(D-026 第 5 條;只用已調整價 auto_adjust)
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# 唯一入口(D-020 第 4 條):裝好套件後 `karst` 就是那道門;
# 未裝套件時同一道門叫 `python -m karst.gateway`。
[project.scripts]
karst = "karst.gateway.cli:main"

[tool.setuptools]
packages = ["karst", "karst.data", "karst.engine", "karst.gateway", "karst.metrics", "karst.risk", "karst.runs", "karst.strategies", "karst.sweep", "karst.web"]

# 本機網頁殼(KARST-032)的靜態頁與圖表庫要跟住套件一齊裝,否則裝好之後
# `python -m karst.web` 起得到服務但開出來是白頁。
[tool.setuptools.package-data]
"karst.web" = ["static/*.html", "static/*.css", "static/*.js", "static/vendor/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
