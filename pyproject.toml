[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "karst-workbench"
version = "0.2.0"
description = "File-based investment research contracts and offline publication core"
requires-python = ">=3.11"
dependencies = ["jsonschema==4.26.0", "referencing==0.37.0", "rfc3339-validator==0.1.4", "tzdata>=2025.2"]

[project.scripts]
karst = "karst.run:main"

[tool.setuptools.packages.find]
include = ["karst*"]

[tool.setuptools.package-data]
karst = ["contracts/v0_1/*.json", "contracts/v0_2/*.json", "page/*.css", "examples/synthetic/*.json", "examples/synthetic/*.txt"]
