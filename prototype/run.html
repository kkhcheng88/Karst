<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>運行詳情 RUN-2026-0812-07 — Karst 原型</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="fit">

<div id="nav-host"></div>

<main class="wrap">

  <header class="page-head">
    <div class="page-head-row">
      <div>
        <div class="page-title-group">
          <nav class="breadcrumb" aria-label="麵包屑" style="margin:0">
            <a href="index.html">策略總覽</a><span>／</span>
            <a href="strategy.html">趨勢波段</a><span>／</span>
          </nav>
          <h1>運行詳情</h1>
          <span class="page-en mono" id="bc-run"></span>
          <span class="proto-badge">原型・假數據</span>
        </div>
        <p class="page-sub">一次回測運行的完整留痕:同樣的版本、參數與數據快照,重跑一次要得出同樣的數字。</p>
      </div>
    </div>
  </header>

  <!-- ============ 頁頂留痕摘要:四格版本綁定 ============ -->
  <div class="trace-grid" id="trace" aria-label="留痕摘要"></div>
  <div class="trace-tail" id="trace-tail"></div>

  <!-- 這次運行綁死的版本已經落後於現行版本,要講明 -->
  <div id="stale-host"></div>

  <dialog class="modal" id="rerun-modal" aria-labelledby="rerun-title">
    <div class="modal-body">
      <div class="modal-title" id="rerun-title">以現版本重跑</div>
      <div id="rerun-body"></div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="rerun-close">知道了</button>
    </div>
  </dialog>

  <!-- ============ 詳情指標:收成一行 ============ -->
  <div class="kpi-row" id="kpis-main" style="flex:none"></div>

  <!-- ============ 主體:分頁,任何一頁都不會把版面拉長 ============ -->
  <div class="fit-main">
    <div class="fit-panel">
      <div class="tabs" role="tablist" aria-label="運行內容">
        <button class="tab-btn" role="tab" id="tab-eq" aria-selected="true" aria-controls="p-eq">淨值走勢</button>
        <button class="tab-btn" role="tab" id="tab-chg" aria-selected="false" aria-controls="p-chg">持倉變化</button>
        <button class="tab-btn" role="tab" id="tab-tr" aria-selected="false" aria-controls="p-tr">逐筆交易</button>
        <button class="tab-btn" role="tab" id="tab-dr" aria-selected="false" aria-controls="p-dr">交易鑽入</button>
        <div class="bench-line" id="equity-legend" style="margin-left:auto;align-self:center;padding-right:var(--s-4)"></div>
      </div>
      <div class="fit-panel-body">

        <div class="tab-panel" id="p-eq" role="tabpanel" aria-labelledby="tab-eq">
          <div class="chart-box" id="equity-chart"></div>
          <p class="section-note" id="equity-note" style="padding:var(--s-2) var(--s-4) var(--s-3)"></p>
        </div>

        <div class="tab-panel" id="p-chg" role="tabpanel" aria-labelledby="tab-chg" hidden>
          <table class="kt" style="min-width:860px">
            <thead>
              <tr>
                <th style="width:108px">日期</th>
                <th style="width:74px">動作</th>
                <th style="width:76px">代號</th>
                <th style="width:132px">名稱</th>
                <th class="num" style="width:86px">調整前</th>
                <th class="num" style="width:86px">調整後</th>
                <th class="num" style="width:78px">變動</th>
                <th>原因</th>
              </tr>
            </thead>
            <tbody id="changes-body"></tbody>
          </table>
          <div class="table-foot">
            <span id="changes-foot"></span>
            <span>權重為佔組合總值百分比</span>
          </div>
        </div>

        <div class="tab-panel" id="p-tr" role="tabpanel" aria-labelledby="tab-tr" hidden>
          <div id="trades-table"></div>
        </div>

        <div class="tab-panel" id="p-dr" role="tabpanel" aria-labelledby="tab-dr" hidden>
          <div id="drill-host"></div>
        </div>

      </div>
    </div>
  </div>

  <p class="archive-line">
    舊變體(存檔,已不在主導航):<a href="stock-a.html">A・因子放側欄</a>　<a href="stock-b.html">B・因子放下方</a>
  </p>

  <div id="foot-host"></div>
</main>

<script src="vendor/lightweight-charts.standalone.production.js"></script>
<script src="assets/data.js" charset="utf-8"></script>
<script src="assets/data-ext.js" charset="utf-8"></script>
<script src="assets/app.js" charset="utf-8"></script>
<script>
(function () {
  var K = window.KARST;
  KV.mountNav('run.html');
  KV.mountFoot();

  var r = K.run, d = r.derived, st = r.stats;
  document.getElementById('bc-run').textContent = r.id;

  /* ---- 留痕摘要:四格講齊「這個數字綁死了什麼版本」 ---- */
  var bind = r.binding;
  var stale = K.staleCheck(bind);
  var staleNames = {};
  stale.items.forEach(function (it) { staleNames[it.name] = it; });

  /* 因子版本逐個寫,落後那個標黃 */
  var factorCell = bind.factors.map(function (f) {
    var reg = K.factorRegistry.filter(function (x) { return x.id === f.id; })[0];
    var nm = reg ? reg.name : f.id;
    var isStale = !!staleNames[nm];
    return '<span class="' + (isStale ? 'ver-stale' : '') + '">' +
      KV.esc(nm) + ' ' + KV.esc(f.ver) + (isStale ? ' ▲' : '') + '</span>';
  }).join('<span class="dim">・</span>');

  var cells = [
    { k: '策略版本', v: KV.esc(bind.strategyVer) +
        (staleNames['趨勢波段'] ? ' <span class="ver-stale">▲</span>' : ''),
      hint: '這次運行用的策略程式版本' },
    { k: '因子版本', v: factorCell, hint: '每個因子各有自己的版本,分開計' },
    { k: '參數', v: KV.esc(r.params), hint: '這次運行實際餵入的參數' },
    { k: '數據快照編號', v: KV.esc(r.snapshot), hint: '定住當時的價格與財務數據,重跑才會得出同樣的數字' },
  ];
  document.getElementById('trace').innerHTML = cells.map(function (c) {
    return '<div class="trace-cell">' +
      '<div class="trace-cell-k">' + c.k +
        '<span class="hint" title="' + KV.esc(c.hint) + '">?</span></div>' +
      '<div class="trace-cell-v">' + c.v + '</div>' +
    '</div>';
  }).join('');

  document.getElementById('trace-tail').innerHTML =
    ['運行編號 ' + r.id, '策略 ' + r.strategyName,
     '期間 ' + r.periodFrom + ' → ' + r.periodTo,
     '引擎 ' + r.engine, '運行時間 ' + r.ranAt]
      .map(function (t) { return '<span>' + KV.esc(t) + '</span>'; }).join('');

  /* ---- 舊版本標記 ---- */
  if (stale.stale) {
    var it = stale.items[0];
    document.getElementById('stale-host').innerHTML =
      '<div class="stale-bar">' +
        '<span class="stale-badge">舊版本</span>' +
        '<span class="stale-text"><b>' + KV.esc(it.name) + '計法已於 ' + KV.esc(it.updatedAt) +
          ' 更新(' + KV.esc(it.now) + '),本運行結果為 ' + KV.esc(it.was) +
          ' 之下的紀錄,不會自動更新。</b>　改動:' + KV.esc(it.whatChanged) + '</span>' +
        '<button class="btn btn-primary" id="rerun-btn">以現版本重跑</button>' +
      '</div>';

    var modal = document.getElementById('rerun-modal');
    document.getElementById('rerun-body').innerHTML =
      '<p>會用現行版本重跑一次,產生一個<b>新的運行</b>,與本運行血統相連:同一個策略、同一段期間、同一個數據快照,' +
        '分別只在版本。兩個運行可以並排比較,本運行的數字不會被改寫。</p>' +
      '<div class="lineage">' +
        '本運行　<b>' + KV.esc(r.id) + '</b>　' + KV.esc(bind.strategyVer) + '・' +
          KV.esc(K.factorLine(bind)) + '<br>' +
        '　　└─ 新運行　<b>RUN-2026-0826-NEW</b>　' + KV.esc(K.strategyCurrentVer) + '・' +
          KV.esc(K.factorRegistry.map(function (f) { return f.name + ' ' + f.current; }).join('・')) +
      '</div>' +
      '<p class="dim">原型不會真的重跑 —— 這一格只為示意「舊運行不改寫,新運行接上血統」。</p>';

    document.getElementById('rerun-btn').addEventListener('click', function () {
      if (modal.showModal) modal.showModal();
    });
    document.getElementById('rerun-close').addEventListener('click', function () {
      modal.close();
    });
  }

  /* ---- 指標一行收齊。基準不再獨佔卡片,只在圖例列出現 ---- */
  var main = [
    { label: '年化超額', hint: '策略年化回報減去 QQQ 年化回報',
      value: KV.pp(d.excessCagr), cls: KV.cls(d.excessCagr),
      basis: '策略 ' + KV.pctPlain(d.cagr) + '・QQQ ' + KV.pctPlain(d.qqqCagr) },
    { label: '最大回撤', hint: '由高位跌到低位的最深一次',
      value: KV.pctPlain(d.maxDD), cls: 'down',
      basis: 'QQQ ' + KV.pctPlain(d.qqqMaxDD) + '・較淺' },
    { label: 'Sortino', hint: '只罰下行波動的風險調整回報',
      value: d.sortino.toFixed(2), cls: '',
      basis: 'QQQ ' + K.benchmarks.QQQ.metrics.sortino.toFixed(2) + '・年化波動 ' + KV.pctPlain(d.vol) },
    { label: '勝率 ／ 盈虧比', hint: '贏面有多大、贏一次抵蝕幾次',
      value: st.winRate.toFixed(0) + '% ／ ' + st.plRatio.toFixed(2), cls: '',
      basis: '贏面細但賺得大' },
    { label: '平均持倉日數', hint: '每筆交易由進場到出場的日曆日數平均',
      value: st.avgHold + ' 日', cls: '',
      basis: '共 ' + st.tradeCount + ' 筆交易' },
    { label: '換手率', hint: '一年內組合被換掉多少次,按年化計',
      value: d.turnover + '%', cls: '',
      basis: '約每 ' + Math.round(365 / (d.turnover / 100)) + ' 日換足一轉' },
  ];
  document.getElementById('kpis-main').style.gridTemplateColumns =
    'repeat(' + main.length + ', minmax(0, 1fr))';
  document.getElementById('kpis-main').innerHTML = main.map(function (k) {
    return '<div class="kpi">' +
      '<div class="kpi-label">' + k.label +
        '<span class="hint" title="' + KV.esc(k.hint) + '">?</span></div>' +
      '<div class="kpi-value sm ' + k.cls + '">' + k.value + '</div>' +
      '<div class="kpi-basis">' + k.basis + '</div>' +
    '</div>';
  }).join('');

  /* ---- 三線淨值圖:基準只在圖例列以一行細字並排 ---- */
  document.getElementById('equity-note').textContent =
    '三條線同以 ' + r.series.dates[0] + ' 為基期 100,直接可比。期間 ' +
    r.periodFrom + ' 至 ' + r.periodTo + '。最佳單筆 ' + KV.pct(st.bestTrade) +
    ',最差單筆 ' + KV.pct(st.worstTrade) + '(止蝕設 8%,最差略為穿位)。';

  document.getElementById('equity-legend').innerHTML =
    '<span><i style="background:#26a69a"></i>趨勢波段 <b class="up">' + KV.pct(d.cumReturn) +
      '</b>・年化 <b>' + KV.pctPlain(d.cagr) + '</b></span>' +
    '<span><i style="background:#b07de0"></i>QQQ <b>' + KV.pct(d.qqqCumReturn) +
      '</b>・年化 <b>' + KV.pctPlain(d.qqqCagr) + '</b></span>' +
    '<span><i style="background:#7d869c"></i>SPY <b>' + KV.pct(d.spyCumReturn) +
      '</b>・年化 <b>' + KV.pctPlain(K.benchmarks.SPY.metrics.cagr) + '</b></span>';

  /* 圖高由分頁面板實際量得的高度分配,底部時間軸才不會被切走 */
  function panelH(panelId, reserve) {
    var body = document.getElementById(panelId).parentElement;
    return Math.max(220, Math.round(body.clientHeight - reserve));
  }

  var chart = KV.makeChart(document.getElementById('equity-chart'),
    panelH('p-eq', document.getElementById('equity-note').offsetHeight + 18));
  var sSpy = chart.addLineSeries({ color: '#7d869c', lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
  sSpy.setData(KV.zip(r.series.dates, r.series.spy));
  var sQqq = chart.addLineSeries({ color: '#b07de0', lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
  sQqq.setData(KV.zip(r.series.dates, r.series.qqq));
  var sStr = chart.addLineSeries({ color: '#26a69a', lineWidth: 2, priceLineVisible: false, lastValueVisible: false });
  sStr.setData(KV.zip(r.series.dates, r.series.strategy));
  chart.timeScale().fitContent();

  /* ---- 持倉變化 ---- */
  var ACT_CLS = { '新增': 'act-add', '加倉': 'act-add', '減倉': 'act-reduce', '清倉': 'act-exit' };
  document.getElementById('changes-body').innerHTML = r.holdingChanges.map(function (c) {
    var delta = Math.round((c.after - c.before) * 10) / 10;
    return '<tr>' +
      '<td class="mono dim">' + c.date + '</td>' +
      '<td><span class="badge-act ' + ACT_CLS[c.action] + '">' + c.action + '</span></td>' +
      '<td class="mono">' + KV.esc(c.sym) + '</td>' +
      '<td title="' + KV.esc(c.name) + '">' + KV.esc(c.name) + '</td>' +
      '<td class="num dim">' + (c.before ? KV.pctPlain(c.before) : '—') + '</td>' +
      '<td class="num">' + (c.after ? KV.pctPlain(c.after) : '—') + '</td>' +
      '<td class="num ' + KV.cls(delta) + '">' + KV.pp(delta) + '</td>' +
      '<td class="dim" title="' + KV.esc(c.reason) + '">' + KV.esc(c.reason) + '</td>' +
    '</tr>';
  }).join('');
  document.getElementById('changes-foot').textContent =
    '顯示最後 ' + r.holdingChanges.length + ' 筆調整・最新在上';

  /* ---- 分頁 ---- */
  KV.initTabs('.tabs');
  /* 基準圖例只屬於淨值那一頁,轉去其他分頁就收起,免得誤讀成當前圖的數字 */
  var legendEl = document.getElementById('equity-legend');
  document.querySelectorAll('.tabs .tab-btn').forEach(function (b) {
    b.addEventListener('click', function () {
      legendEl.style.visibility = (b.id === 'tab-eq') ? 'visible' : 'hidden';
    });
  });
  function goTab(id) {
    var b = document.getElementById(id);
    if (b && b.getAttribute('aria-selected') !== 'true') b.click();
  }

  /* ============================================================
     鑽入:點一筆交易,切到「交易鑽入」分頁開該股的蠟燭圖 + 因子側欄
     ============================================================ */
  var drillHost = document.getElementById('drill-host');
  var drillChart = null;
  var table = null;

  var FDEF = [
    { key: 'quality',   name: '質素',   color: '#4a9eff' },
    { key: 'momentum',  name: '動量',   color: '#26a69a' },
    { key: 'oversold',  name: '超賣度', color: '#f0a83c' },
    { key: 'supply',    name: '供求',   color: '#b07de0' },
    { key: 'composite', name: '綜合分', color: '#e8eaf0' },
  ];

  function showHint() {
    drillHost.innerHTML =
      '<div class="drill-hint">去「逐筆交易」分頁點任何一筆,這裡即出該股的蠟燭圖(有進出場標記)與當時的因子檢視。</div>';
  }

  function openTrade(t) {
    var S = K.tradeSeries(t);
    var F = S.factors;

    goTab('tab-dr');   /* 先切分頁,圖才量得到闊度 */

    if (drillChart) { try { drillChart.remove(); } catch (e) {} drillChart = null; }

    drillHost.innerHTML =
      '<div class="drill">' +

        '<div class="chart-panel" style="background:transparent;padding:0">' +
          '<div class="chart-head">' +
            '<div>' +
              '<h3>' + KV.esc(t.sym) + '　' + KV.esc(t.name) +
                ' <span class="tag" style="margin-left:var(--s-2)">' + KV.esc(t.sector) + '</span></h3>' +
              '<div class="section-note">' + KV.esc(t.id) + '・' +
                t.entryDate + ' 進場 ' + t.entryPx.toFixed(2) + ' → ' +
                t.exitDate + ' 出場 ' + t.exitPx.toFixed(2) +
                '・持倉 ' + t.holdDays + ' 日・' + KV.esc(t.reason) +
                '　損益 <b class="' + KV.cls(t.pnl) + '">' + (t.pnl > 0 ? '+' : '') + KV.money(t.pnl) +
                '(' + KV.pct(t.retPct) + ')</b></div>' +
            '</div>' +
            '<div style="display:flex;align-items:center;gap:var(--s-3)">' +
              '<div class="chart-legend" id="d-ohlc"></div>' +
              '<button class="drill-close" id="d-close">回到逐筆交易</button>' +
            '</div>' +
          '</div>' +
          '<div class="chart-box" id="d-candle"></div>' +
          '<p class="section-note" style="margin:var(--s-2) 0 0">' +
            '綠色向上箭嘴為買入,紅色向下箭嘴為賣出。掃過蠟燭圖,右邊因子欄會跳到那一天。</p>' +
        '</div>' +

        '<aside class="factor-side" aria-label="因子檢視">' +
          '<div class="factor-side-head">' +
            '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:var(--s-2)">' +
              '<h3 style="font-size:var(--fs-md)">因子檢視</h3>' +
              '<span class="tag" id="d-date"></span>' +
            '</div>' +
            '<p class="section-note" style="margin:var(--s-2) 0 0">' +
              '答「策略為什麼那時候買這隻」。掃過左邊蠟燭圖即可換日。</p>' +
          '</div>' +
          '<div id="d-bars"></div>' +

          '<div class="factor-side-head" style="padding-top:var(--s-3)">' +
            '<div style="display:flex;align-items:baseline;justify-content:space-between">' +
              '<h4>本段走勢</h4>' +
              '<span class="section-note">' + F.length + ' 個交易日</span>' +
            '</div>' +
          '</div>' +
          '<div id="d-sparks"></div>' +

          '<div class="factor-side-head" style="padding-top:var(--s-3)">' +
            '<h4>持倉期間</h4>' +
            '<p class="section-note" style="margin:var(--s-1) 0 var(--s-2)">綠 = 策略持有中,灰 = 沒有持有</p>' +
            '<div class="sel-strip" id="d-strip"></div>' +
            '<div class="scale-ends"><span>' + F[0].time + '</span><span>' + F[F.length - 1].time + '</span></div>' +
          '</div>' +

          '<div class="factor-side-head" style="padding-top:var(--s-3)">' +
            '<h4>逐日分數</h4>' +
            '<p class="section-note" style="margin:var(--s-1) 0 0">出場前後 30 個交易日,最新在上</p>' +
          '</div>' +
          '<div class="table-scroll table-scroll-y" id="d-scroll">' +
            '<table class="kt" style="min-width:308px">' +
              '<thead><tr>' +
                '<th style="width:84px">日期</th>' +
                '<th class="num" style="width:44px">質素</th>' +
                '<th class="num" style="width:44px">動量</th>' +
                '<th class="num" style="width:44px">超賣</th>' +
                '<th class="num" style="width:48px">綜合</th>' +
                '<th style="width:48px">持有</th>' +
              '</tr></thead>' +
              '<tbody id="d-body"></tbody>' +
            '</table>' +
          '</div>' +
        '</aside>' +

      '</div>';

    /* ---- 蠟燭圖 ---- */
    var el = document.getElementById('d-candle');
    drillChart = KV.makeChart(el, panelH('p-dr', 118));

    var candles = drillChart.addCandlestickSeries({
      upColor: '#26a69a', downColor: '#ef5350',
      borderUpColor: '#26a69a', borderDownColor: '#ef5350',
      wickUpColor: '#26a69a', wickDownColor: '#ef5350',
    });
    candles.setData(S.candles);
    candles.priceScale().applyOptions({ scaleMargins: { top: 0.06, bottom: 0.26 } });

    var vol = drillChart.addHistogramSeries({
      priceFormat: { type: 'volume' },
      priceScaleId: '',
      color: 'rgba(122,134,156,.4)',
      priceLineVisible: false,
      lastValueVisible: false,
    });
    vol.setData(S.volumes.map(function (v, i) {
      var c = S.candles[i];
      return { time: v.time, value: v.value,
        color: c.close >= c.open ? 'rgba(38,166,154,.35)' : 'rgba(239,83,80,.35)' };
    }));
    vol.priceScale().applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });

    candles.setMarkers(S.markers.map(function (mk) {
      return {
        time: mk.time,
        position: mk.side === 'buy' ? 'belowBar' : 'aboveBar',
        color: mk.side === 'buy' ? '#26a69a' : '#ef5350',
        shape: mk.side === 'buy' ? 'arrowUp' : 'arrowDown',
        text: mk.text,
      };
    }));
    drillChart.timeScale().fitContent();

    /* ---- 因子條 ---- */
    function renderBars(f) {
      document.getElementById('d-date').textContent = f.time;
      document.getElementById('d-bars').innerHTML = FDEF.map(function (def) {
        var v = f[def.key];
        return '<div class="factor-row">' +
          '<span class="factor-name">' + def.name + '</span>' +
          '<span class="factor-bar-track">' +
            '<i class="factor-bar-fill" style="width:' + v + '%;background:' + def.color + '"></i>' +
          '</span>' +
          '<span class="factor-score">' + v.toFixed(0) + '</span>' +
        '</div>';
      }).join('') +
      '<div class="factor-row" style="grid-template-columns:62px 1fr">' +
        '<span class="factor-name">持有</span>' +
        '<span>' + (f.selected
          ? '<span class="badge-act act-add">持有中</span>'
          : '<span class="badge-act" style="background:var(--bg-3);color:var(--text-3)">沒有持有</span>') +
        '</span>' +
      '</div>';
    }
    renderBars(F[S.exitIndex]);

    /* ---- 細行圖 ---- */
    document.getElementById('d-sparks').innerHTML = FDEF.map(function (def, i) {
      return '<div class="factor-row" style="grid-template-columns:62px 1fr 40px">' +
        '<span class="factor-name">' + def.name + '</span>' +
        '<span class="factor-spark" id="d-fs-' + i + '"></span>' +
        '<span class="factor-score" style="color:' + def.color + '">' +
          F[S.exitIndex][def.key].toFixed(0) + '</span>' +
      '</div>';
    }).join('');
    FDEF.forEach(function (def, i) {
      KV.factorSpark(document.getElementById('d-fs-' + i),
        F.map(function (f) { return f[def.key]; }), def.color);
    });

    /* ---- 持倉期間帶 ---- */
    document.getElementById('d-strip').innerHTML = F.map(function (f) {
      return '<i class="' + (f.selected ? 'sel-yes' : 'sel-no') + '"></i>';
    }).join('');

    /* ---- 逐日分數 ---- */
    document.getElementById('d-scroll').style.maxHeight =
      Math.max(120, Math.round(window.innerHeight - 880)) + 'px';
    var recent = F.slice(Math.max(0, S.exitIndex - 22), S.exitIndex + 8).reverse();
    function renderTable(highlight) {
      document.getElementById('d-body').innerHTML = recent.map(function (f) {
        var on = highlight === f.time;
        return '<tr' + (on ? ' class="is-current"' : '') + '>' +
          '<td class="mono dim">' + f.time.slice(5) + '</td>' +
          '<td class="num">' + f.quality.toFixed(0) + '</td>' +
          '<td class="num">' + f.momentum.toFixed(0) + '</td>' +
          '<td class="num">' + f.oversold.toFixed(0) + '</td>' +
          '<td class="num" style="font-weight:700">' + f.composite.toFixed(0) + '</td>' +
          '<td>' + (f.selected ? '<span class="up">●</span> 是' : '<span class="dim">○ 否</span>') + '</td>' +
        '</tr>';
      }).join('');
    }
    renderTable(null);

    /* ---- 十字線同步 ---- */
    var byDate = {}, candleByDate = {};
    F.forEach(function (f) { byDate[f.time] = f; });
    S.candles.forEach(function (c) { candleByDate[c.time] = c; });

    function timeToISO(tm) {
      if (typeof tm === 'string') return tm;
      if (tm && tm.year) {
        return tm.year + '-' + String(tm.month).padStart(2, '0') + '-' + String(tm.day).padStart(2, '0');
      }
      return null;
    }
    var ohlc = document.getElementById('d-ohlc');
    function showOHLC(c) {
      if (!c) { ohlc.innerHTML = ''; return; }
      var up = c.close >= c.open;
      ohlc.innerHTML =
        '<span class="legend-item">開 <b class="legend-val">' + c.open.toFixed(2) + '</b></span>' +
        '<span class="legend-item">高 <b class="legend-val">' + c.high.toFixed(2) + '</b></span>' +
        '<span class="legend-item">低 <b class="legend-val">' + c.low.toFixed(2) + '</b></span>' +
        '<span class="legend-item">收 <b class="legend-val ' + (up ? 'up' : 'down') + '">' +
          c.close.toFixed(2) + '</b></span>';
    }
    showOHLC(S.candles[S.exitIndex]);

    drillChart.subscribeCrosshairMove(function (param) {
      var iso = timeToISO(param.time);
      if (!iso || !byDate[iso]) {
        renderBars(F[S.exitIndex]);
        renderTable(null);
        showOHLC(S.candles[S.exitIndex]);
        return;
      }
      renderBars(byDate[iso]);
      renderTable(iso);
      showOHLC(candleByDate[iso]);
    });

    document.getElementById('d-close').addEventListener('click', function () {
      if (drillChart) { try { drillChart.remove(); } catch (e) {} drillChart = null; }
      if (table) table.select(null);
      showHint();
      goTab('tab-tr');
    });
  }

  /* ---- 逐筆交易(可排序,狀態入網址;點行即鑽入) ---- */
  table = KV.sortableTable({
    mount: '#trades-table',
    minWidth: '1240px',
    maxHeight: Math.max(200, Math.round(window.innerHeight - 430)) + 'px',
    defaultSort: 'entryDate',
    defaultDir: 'desc',
    rows: r.trades,
    rowKey: function (t) { return t.id; },
    onRowClick: function (t) {
      table.select(t.id);
      openTrade(t);
    },
    cols: [
      { key: 'id', label: '編號', width: '68px', get: function (t) { return t.id; },
        render: function (t) { return '<span class="mono dim">' + t.id + '</span>'; } },
      { key: 'sym', label: '代號', width: '74px', get: function (t) { return t.sym; },
        render: function (t) { return '<span class="mono">' + KV.esc(t.sym) + '</span>'; } },
      { key: 'name', label: '名稱', width: '128px', get: function (t) { return t.name; },
        render: function (t) { return '<span title="' + KV.esc(t.name) + '">' + KV.esc(t.name) + '</span>'; } },
      { key: 'entryDate', label: '進場日', width: '104px', get: function (t) { return Date.parse(t.entryDate); },
        render: function (t) { return '<span class="mono dim">' + t.entryDate + '</span>'; } },
      { key: 'entryPx', label: '進場價', width: '84px', cls: 'num', get: function (t) { return t.entryPx; },
        render: function (t) { return t.entryPx.toFixed(2); } },
      { key: 'exitDate', label: '出場日', width: '104px', get: function (t) { return Date.parse(t.exitDate); },
        render: function (t) { return '<span class="mono dim">' + t.exitDate + '</span>'; } },
      { key: 'exitPx', label: '出場價', width: '84px', cls: 'num', get: function (t) { return t.exitPx; },
        render: function (t) { return t.exitPx.toFixed(2); } },
      { key: 'shares', label: '股數', width: '78px', cls: 'num', get: function (t) { return t.shares; },
        render: function (t) { return t.shares.toLocaleString('en-US'); } },
      { key: 'holdDays', label: '持倉日', width: '76px', cls: 'num', get: function (t) { return t.holdDays; },
        render: function (t) { return t.holdDays; } },
      { key: 'pnl', label: '損益', width: '98px', cls: 'num', get: function (t) { return t.pnl; },
        render: function (t) {
          return '<span class="' + KV.cls(t.pnl) + '">' + (t.pnl > 0 ? '+' : '') + KV.money(t.pnl) + '</span>';
        } },
      { key: 'retPct', label: '報酬率', width: '86px', cls: 'num', get: function (t) { return t.retPct; },
        render: function (t) {
          return '<span class="' + KV.cls(t.retPct) + '">' + KV.pct(t.retPct) + '</span>';
        } },
      { key: 'reason', label: '出場原因', width: '150px', get: function (t) { return t.reason; },
        render: function (t) { return '<span class="dim">' + KV.esc(t.reason) + '</span>'; } },
    ],
    foot: function (rows) {
      return '<span>顯示 1–' + rows.length + ' 筆抽樣,整體共 ' + st.tradeCount + ' 筆' +
        '(抽樣勝率 ' + KV.pctPlain(st.sampleWinRate) + ',整體 ' + KV.pctPlain(st.winRate) + ')</span>' +
        '<span>點一行即切去「交易鑽入」分頁</span>';
    },
  });

  showHint();
})();
</script>
</body>
</html>
