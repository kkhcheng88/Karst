<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>運行詳情 RUN-2026-0812-07 — Karst 原型</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="fit">

<div id="nav-host"></div>

<main class="wrap">

  <header class="page-head">
    <div class="page-head-row">
      <div>
        <div class="page-title-group">
          <nav class="breadcrumb" aria-label="麵包屑" style="margin:0">
            <a href="index.html">策略總覽</a><span>／</span>
            <a href="strategy.html">趨勢波段</a><span>／</span>
          </nav>
          <h1>運行詳情</h1>
          <span class="page-en mono" id="bc-run"></span>
          <span class="proto-badge">原型・假數據</span>
        </div>
        <p class="page-sub">左邊看圖、右邊看數。圖上每個標記是一個有買賣的交易日,點下去右邊即跳到那幾筆交易。</p>
      </div>
    </div>
  </header>

  <!-- ============ 頂部一條薄摘要列:版本綁定 + 舊版本標 + 重跑 ============ -->
  <div class="trace-slim" id="trace" aria-label="留痕摘要"></div>

  <dialog class="modal" id="rerun-modal" aria-labelledby="rerun-title">
    <div class="modal-body">
      <div class="modal-title" id="rerun-title">以現版本重跑</div>
      <div id="rerun-body"></div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="rerun-close">知道了</button>
    </div>
  </dialog>

  <div class="fit-main" style="grid-template-columns:minmax(0,62fr) minmax(0,38fr)">

    <!-- ============ 左欄:圖區 ============ -->
    <section class="fit-panel" aria-labelledby="chart-title">
      <div class="fit-panel-head">
        <div id="chart-title" style="min-width:0"></div>
        <div style="display:flex;align-items:center;gap:var(--s-3);flex:none">
          <div class="bench-line" id="chart-legend"></div>
          <button class="chart-x" id="chart-back" hidden title="返回淨值走勢" aria-label="返回淨值走勢">✕</button>
        </div>
      </div>
      <div class="fit-panel-body" style="overflow:hidden;display:flex;flex-direction:column">
        <div class="chart-box" id="main-chart" style="flex:1 1 auto;min-height:0"></div>
        <div class="hband-wrap" id="band-wrap">
          <div class="hband-head">
            <span>持倉帶　<span class="dim">每條橫線是一隻股,色塊在的時候即是持有中,色塊越高比重越大</span></span>
            <span id="band-note"></span>
          </div>
          <div class="hband" id="hband"></div>
          <div class="bench-line" id="band-legend" style="margin-top:var(--s-1)"></div>
        </div>
      </div>
    </section>

    <!-- ============ 右欄:一張卡,三個分頁 ============ -->
    <section class="fit-panel" aria-label="運行數字">
      <div class="tabs" role="tablist" aria-label="右欄內容">
        <button class="tab-btn" role="tab" id="tab-m" aria-selected="true" aria-controls="p-m">指標</button>
        <button class="tab-btn" role="tab" id="tab-t" aria-selected="false" aria-controls="p-t">逐筆交易</button>
        <button class="tab-btn" role="tab" id="tab-f" aria-selected="false" aria-controls="p-f">因子檢視</button>
      </div>
      <div class="fit-panel-body" id="right-body">

        <div class="tab-panel" id="p-m" role="tabpanel" aria-labelledby="tab-m">
          <div class="mgrid" id="kpis"></div>
          <p class="section-note" id="metrics-note" style="padding:0 var(--s-3) var(--s-3)"></p>
        </div>

        <div class="tab-panel" id="p-t" role="tabpanel" aria-labelledby="tab-t" hidden>
          <div id="trades-table"></div>
        </div>

        <div class="tab-panel" id="p-f" role="tabpanel" aria-labelledby="tab-f" hidden>
          <div id="factor-host"></div>
        </div>

      </div>
    </section>

  </div>

  <p class="archive-line">
    舊變體(存檔,已不在主導航):<a href="stock-a.html">A・因子放側欄</a>　<a href="stock-b.html">B・因子放下方</a>
  </p>

  <div id="foot-host"></div>
</main>

<script src="vendor/lightweight-charts.standalone.production.js"></script>
<script src="assets/data.js" charset="utf-8"></script>
<script src="assets/data-ext.js" charset="utf-8"></script>
<script src="assets/app.js" charset="utf-8"></script>
<script>
(function () {
  var K = window.KARST;
  KV.mountNav('run.html');
  KV.mountFoot();

  var r = K.run, d = r.derived, st = r.stats;
  document.getElementById('bc-run').textContent = r.id;

  /* ============================================================
     頂部薄摘要列
     ============================================================ */
  var bind = r.binding;
  var stale = K.staleCheck(bind);
  var staleNames = {};
  stale.items.forEach(function (it) { staleNames[it.name] = it; });

  var factorCell = bind.factors.map(function (f) {
    var reg = K.factorRegistry.filter(function (x) { return x.id === f.id; })[0];
    var nm = reg ? reg.name : f.id;
    var bad = !!staleNames[nm];
    return '<span class="' + (bad ? 'ver-stale' : '') + '">' +
      KV.esc(nm) + ' ' + KV.esc(f.ver) + (bad ? ' ▲' : '') + '</span>';
  }).join('<span class="dim">・</span>');

  function kv(k, v, hint) {
    return '<span class="ts-pair" title="' + KV.esc(hint || '') + '">' +
      '<span class="ts-k">' + k + '</span><span class="ts-v">' + v + '</span></span>';
  }

  var slim =
    kv('版本', KV.esc(bind.strategyVer), '這次運行用的策略程式版本') +
    '<span class="ts-sep">|</span>' +
    kv('因子', factorCell, '每個因子各有自己的版本,分開計') +
    '<span class="ts-sep">|</span>' +
    kv('參數', KV.esc(r.params), '這次運行實際餵入的參數') +
    '<span class="ts-sep">|</span>' +
    kv('快照', KV.esc(r.snapshot), '定住當時的價格與財務數據,重跑才會得出同樣的數字');

  if (stale.stale) {
    var it = stale.items[0];
    var full = it.name + '計法已於 ' + it.updatedAt + ' 更新(' + it.now +
      '),本運行結果為 ' + it.was + ' 之下的紀錄,不會自動更新。改動:' + it.whatChanged;
    slim +=
      '<span class="stale-badge" style="margin-left:auto">舊版本</span>' +
      '<span class="ts-warn" title="' + KV.esc(full) + '">' +
        KV.esc(it.name + '已更新至 ' + it.now + ',本運行不會自動更新') + '</span>' +
      '<button class="btn btn-primary" id="rerun-btn">以現版本重跑</button>';
  }
  document.getElementById('trace').innerHTML = slim;

  if (stale.stale) {
    var modal = document.getElementById('rerun-modal');
    document.getElementById('rerun-body').innerHTML =
      '<p><b>' + KV.esc(stale.items[0].name) + '計法已於 ' + KV.esc(stale.items[0].updatedAt) +
        ' 更新(' + KV.esc(stale.items[0].now) + '),本運行結果為 ' + KV.esc(stale.items[0].was) +
        ' 之下的紀錄,不會自動更新。</b>改動:' + KV.esc(stale.items[0].whatChanged) + '</p>' +
      '<p>按下去會用現行版本重跑一次,產生一個<b>新的運行</b>,與本運行血統相連:同一個策略、同一段期間、' +
        '同一個數據快照,分別只在版本。兩個運行可以並排比較,本運行的數字不會被改寫。</p>' +
      '<div class="lineage">' +
        '本運行　<b>' + KV.esc(r.id) + '</b>　' + KV.esc(bind.strategyVer) + '・' +
          KV.esc(K.factorLine(bind)) + '<br>' +
        '　　└─ 新運行　<b>RUN-2026-0826-NEW</b>　' + KV.esc(K.strategyCurrentVer) + '・' +
          KV.esc(K.factorRegistry.map(function (f) { return f.name + ' ' + f.current; }).join('・')) +
      '</div>' +
      '<p class="dim">原型不會真的重跑 —— 這一格只為示意「舊運行不改寫,新運行接上血統」。</p>';

    document.getElementById('rerun-btn').addEventListener('click', function () {
      if (modal.showModal) modal.showModal();
    });
    document.getElementById('rerun-close').addEventListener('click', function () { modal.close(); });
  }

  /* ============================================================
     右欄一:指標(2×4)
     ============================================================ */
  var METRICS = [
    { l: '累計 對基準', v: KV.pp(Math.round((d.cumReturn - d.qqqCumReturn) * 10) / 10),
      c: KV.cls(d.cumReturn - d.qqqCumReturn), b: '本運行 ' + KV.pct(d.cumReturn) },
    { l: '年化回報', v: KV.pctPlain(d.cagr), c: KV.cls(d.cagr), b: 'QQQ ' + KV.pctPlain(d.qqqCagr) },
    { l: '最大回撤', v: KV.pctPlain(d.maxDD), c: 'down', b: 'QQQ ' + KV.pctPlain(d.qqqMaxDD) + '・較淺' },
    { l: '勝率 ／ 盈虧比', v: st.winRate.toFixed(0) + '% ／ ' + st.plRatio.toFixed(2), c: '',
      b: '贏面細但賺得大' },
    { l: '年化超額', v: KV.pp(d.excessCagr), c: KV.cls(d.excessCagr), b: '策略減 QQQ' },
    { l: 'Sortino', v: d.sortino.toFixed(2), c: '',
      b: 'QQQ ' + K.benchmarks.QQQ.metrics.sortino.toFixed(2) },
    { l: '平均持倉日數', v: st.avgHold + ' 日', c: '', b: '共 ' + st.tradeCount + ' 筆交易' },
    { l: '換手率', v: d.turnover + '%', c: '',
      b: '約每 ' + Math.round(365 / (d.turnover / 100)) + ' 日換足一轉' },
  ];
  document.getElementById('kpis').innerHTML = METRICS.map(function (m) {
    return '<div class="mcell">' +
      '<div class="dc-l">' + m.l + '</div>' +
      '<div class="dc-v ' + m.c + '">' + m.v + '</div>' +
      '<div class="dc-b">' + m.b + '</div>' +
    '</div>';
  }).join('');
  document.getElementById('metrics-note').textContent =
    '全部指標由 ' + r.periodFrom + ' 至 ' + r.periodTo + ' 這段期間計出・對比基準 QQQ・' +
    '最佳單筆 ' + KV.pct(st.bestTrade) + ',最差單筆 ' + KV.pct(st.worstTrade) + '。';

  /* ============================================================
     分頁
     ============================================================ */
  KV.initTabs('.tabs');
  function goTab(id) {
    var b = document.getElementById(id);
    if (b && b.getAttribute('aria-selected') !== 'true') b.click();
  }

  /* ============================================================
     左欄圖區
     ============================================================ */
  var chartHost = document.getElementById('main-chart');
  var bandWrap = document.getElementById('band-wrap');
  var legendEl = document.getElementById('chart-legend');
  var titleEl = document.getElementById('chart-title');
  var backBtn = document.getElementById('chart-back');
  var chart = null, strategySeries = null, mode = 'equity';

  function disposeChart() {
    var dead = chart;
    chart = null;
    strategySeries = null;
    chartHost.innerHTML = '';        /* 先脫離版面,舊圖的量度就不會再影響新圖 */
    /* 圖表庫在自己的下一格畫面仍會摸一次舊圖,所以等兩格才真正拆掉,免得它擲錯 */
    if (dead) {
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { try { dead.remove(); } catch (e) {} });
      });
    }
  }

  function chartBox() {
    var box = document.createElement('div');
    chartHost.appendChild(box);
    return box;
  }

  function availH() {
    var body = chartHost.parentElement;
    var used = mode === 'equity' ? bandWrap.offsetHeight : 0;
    return Math.max(200, Math.round(body.clientHeight - used));
  }

  /* ---- 淨值走勢 + 交易日標記 ---- */
  function showEquity() {
    mode = 'equity';
    disposeChart();
    bandWrap.hidden = false;
    backBtn.hidden = true;
    legendEl.hidden = false;

    titleEl.innerHTML =
      '<h2 style="font-size:var(--fs-md)">組合淨值 對 QQQ／SPY</h2>' +
      '<div class="section-note">三條線同以 ' + r.series.dates[0] + ' 為基期 100・' +
        '曲線上的箭嘴是有買賣的交易日,點一下右邊即跳到那幾筆</div>';

    legendEl.innerHTML =
      '<span><i style="background:#26a69a"></i>趨勢波段 <b class="up">' + KV.pct(d.cumReturn) +
        '</b>・年化 <b>' + KV.pctPlain(d.cagr) + '</b></span>' +
      '<span><i style="background:#b07de0"></i>QQQ <b>' + KV.pct(d.qqqCumReturn) +
        '</b>・年化 <b>' + KV.pctPlain(d.qqqCagr) + '</b></span>' +
      '<span><i style="background:#7d869c"></i>SPY <b>' + KV.pct(d.spyCumReturn) +
        '</b>・年化 <b>' + KV.pctPlain(K.benchmarks.SPY.metrics.cagr) + '</b></span>';

    var box = chartBox();
    chart = KV.makeChart(box, availH());

    var sSpy = chart.addLineSeries({ color: '#7d869c', lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
    sSpy.setData(KV.zip(r.series.dates, r.series.spy));
    var sQqq = chart.addLineSeries({ color: '#b07de0', lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
    sQqq.setData(KV.zip(r.series.dates, r.series.qqq));
    strategySeries = chart.addLineSeries({ color: '#26a69a', lineWidth: 2, priceLineVisible: false, lastValueVisible: false });
    strategySeries.setData(KV.zip(r.series.dates, r.series.strategy));

    /* 交易日標記:淨買入綠、淨賣出紅、兩者皆有用中性色 */
    strategySeries.setMarkers(K.tradeMarks.map(function (m) {
      return {
        time: m.date,
        position: m.side === 'sell' ? 'aboveBar' : 'belowBar',
        color: m.side === 'buy' ? '#26a69a' : (m.side === 'sell' ? '#ef5350' : '#8f9bb3'),
        shape: m.side === 'buy' ? 'arrowUp' : (m.side === 'sell' ? 'arrowDown' : 'circle'),
        text: '',
      };
    }));

    chart.timeScale().fitContent();

    chart.subscribeCrosshairMove(function (p) {
      var iso = timeToISO(p.time);
      var m = iso && K.tradeMarkByDate[iso];
      document.getElementById('band-note').textContent = m
        ? (m.date + '　' + m.label + '　點一下看那幾筆')
        : bandNoteDefault;
    });

    chart.subscribeClick(function (p) {
      var iso = timeToISO(p.time);
      var m = iso && K.tradeMarkByDate[iso];
      if (!m) return;
      goTab('tab-t');
      highlightDate(m);
    });

    chart.timeScale().subscribeVisibleTimeRangeChange(renderBand);
    renderBand();
  }

  /* ---- 持倉帶,與上面的曲線用同一條時間軸對齊 ---- */
  var B = K.holdingsBand;
  var bandNoteDefault = '只畫成交次數最多的 ' + B.lanes.length + ' 隻(涵蓋 ' +
    B.coveredTrades + ' / ' + r.trades.length + ' 筆抽樣交易)';
  document.getElementById('band-note').textContent = bandNoteDefault;

  document.getElementById('band-legend').innerHTML = B.lanes.map(function (l) {
    return '<span title="' + KV.esc(l.name) + '"><i style="background:' + l.color +
      ';height:8px;border-radius:2px"></i>' + KV.esc(l.sym) + '</span>';
  }).join('');

  var LANE_H = 9, LANE_GAP = 2;
  var bandEl = document.getElementById('hband');
  /* 先把高度定死,圖才量得準自己有多少位置 */
  var BAND_H = B.lanes.length * LANE_H + (B.lanes.length - 1) * LANE_GAP;
  bandEl.style.height = BAND_H + 'px';

  function renderBand() {
    if (mode !== 'equity' || !chart) return;
    var w = bandEl.clientWidth;
    if (!w) return;
    var ts = chart.timeScale();
    var H = BAND_H;

    var svg = '<svg viewBox="0 0 ' + w + ' ' + H + '" width="' + w + '" height="' + H +
      '" role="img" aria-label="持倉帶:每條橫線一隻股,色塊在的時候即是持有中">';

    B.lanes.forEach(function (l, li) {
      var y = li * (LANE_H + LANE_GAP);
      svg += '<rect x="0" y="' + (y + LANE_H / 2 - 0.5) + '" width="' + w +
        '" height="1" fill="rgba(38,44,59,.9)"/>';

      l.spells.forEach(function (sp) {
        var x1 = ts.timeToCoordinate(sp.from);
        var x2 = ts.timeToCoordinate(sp.to);
        if (x1 === null && x2 === null) return;
        if (x1 === null) x1 = 0;
        if (x2 === null) x2 = w;
        var bw = Math.max(2, x2 - x1);
        var bh = Math.max(3, (sp.weight / B.maxWeight) * LANE_H);
        svg += '<rect x="' + x1.toFixed(1) + '" y="' + (y + LANE_H - bh).toFixed(1) +
          '" width="' + bw.toFixed(1) + '" height="' + bh.toFixed(1) +
          '" rx="1" fill="' + l.color + '" opacity=".85">' +
          '<title>' + KV.esc(l.sym + '　' + l.name + '\n' + sp.from + ' → ' + sp.to +
            '\n比重 ' + sp.weight + '%') + '</title></rect>';
      });
    });

    svg += '</svg>';
    bandEl.innerHTML = svg;
  }

  /* ---- 鑽入:同一個圖區換成該股蠟燭圖 ---- */
  var FDEF = [
    { key: 'quality',   name: '質素',   color: '#4a9eff' },
    { key: 'momentum',  name: '動量',   color: '#26a69a' },
    { key: 'oversold',  name: '超賣度', color: '#f0a83c' },
    { key: 'supply',    name: '供求',   color: '#b07de0' },
    { key: 'composite', name: '綜合分', color: '#e8eaf0' },
  ];

  function timeToISO(tm) {
    if (typeof tm === 'string') return tm;
    if (tm && tm.year) {
      return tm.year + '-' + String(tm.month).padStart(2, '0') + '-' + String(tm.day).padStart(2, '0');
    }
    return null;
  }

  function openTrade(t) {
    var S = K.tradeSeries(t);
    var F = S.factors;

    mode = 'stock';
    disposeChart();
    bandWrap.hidden = true;
    backBtn.hidden = false;
    legendEl.hidden = true;

    titleEl.innerHTML =
      '<h2 style="font-size:var(--fs-md)">' + KV.esc(t.sym) + '　' + KV.esc(t.name) +
        ' <span class="tag" style="margin-left:var(--s-2)">' + KV.esc(t.sector) + '</span></h2>' +
      '<div class="section-note">' + KV.esc(t.id) + '・' + t.entryDate + ' 進場 ' +
        t.entryPx.toFixed(2) + ' → ' + t.exitDate + ' 出場 ' + t.exitPx.toFixed(2) +
        '・持倉 ' + t.holdDays + ' 日・' + KV.esc(t.reason) +
        '　損益 <b class="' + KV.cls(t.pnl) + '">' + (t.pnl > 0 ? '+' : '') + KV.money(t.pnl) +
        '(' + KV.pct(t.retPct) + ')</b></div>';

    var box = chartBox();
    chart = KV.makeChart(box, availH());

    var candles = chart.addCandlestickSeries({
      upColor: '#26a69a', downColor: '#ef5350',
      borderUpColor: '#26a69a', borderDownColor: '#ef5350',
      wickUpColor: '#26a69a', wickDownColor: '#ef5350',
    });
    candles.setData(S.candles);
    candles.priceScale().applyOptions({ scaleMargins: { top: 0.06, bottom: 0.26 } });

    var vol = chart.addHistogramSeries({
      priceFormat: { type: 'volume' }, priceScaleId: '',
      color: 'rgba(122,134,156,.4)', priceLineVisible: false, lastValueVisible: false,
    });
    vol.setData(S.volumes.map(function (v, i) {
      var c = S.candles[i];
      return { time: v.time, value: v.value,
        color: c.close >= c.open ? 'rgba(38,166,154,.35)' : 'rgba(239,83,80,.35)' };
    }));
    vol.priceScale().applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });

    candles.setMarkers(S.markers.map(function (mk) {
      return {
        time: mk.time,
        position: mk.side === 'buy' ? 'belowBar' : 'aboveBar',
        color: mk.side === 'buy' ? '#26a69a' : '#ef5350',
        shape: mk.side === 'buy' ? 'arrowUp' : 'arrowDown',
        text: mk.text,
      };
    }));
    chart.timeScale().fitContent();

    /* 右欄自動切去因子檢視 */
    renderFactorPanel(t, S);
    goTab('tab-f');

    var byDate = {};
    F.forEach(function (f) { byDate[f.time] = f; });

    chart.subscribeCrosshairMove(function (param) {
      var iso = timeToISO(param.time);
      if (!iso || !byDate[iso]) { paintFactors(F[S.exitIndex], F, S, null); return; }
      paintFactors(byDate[iso], F, S, iso);
    });
  }

  function closeDrill() {
    showEquity();
    if (table) table.select(null);
    factorHint();
  }
  backBtn.addEventListener('click', closeDrill);

  /* ============================================================
     右欄三:因子檢視
     ============================================================ */
  var factorHost = document.getElementById('factor-host');

  function factorHint() {
    factorHost.innerHTML =
      '<div class="drill-hint">去「逐筆交易」分頁點一筆交易,左邊會換成該股蠟燭圖,這裡同時出當時的因子檢視。</div>';
  }

  function renderFactorPanel(t, S) {
    var F = S.factors;
    factorHost.innerHTML =
      '<div class="factor-side-head" style="padding:var(--s-3) var(--s-4)">' +
        '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:var(--s-2)">' +
          '<h3 style="font-size:var(--fs-md)">' + KV.esc(t.sym) + ' 因子檢視' +
            '<span class="dim" style="font-weight:400;font-size:var(--fs-xs)">　' +
              F.length + ' 個交易日</span></h3>' +
          '<span class="tag" id="d-date"></span>' +
        '</div>' +
        '<p class="section-note" style="margin:var(--s-1) 0 0">' +
          '答「策略為什麼那時候買這隻」。橫條是當日分數,右邊細圖是本段走勢;掃過左邊蠟燭圖即可換日。</p>' +
      '</div>' +
      '<div id="d-bars"></div>' +

      '<div class="factor-side-head" style="padding:var(--s-2) var(--s-4)">' +
        '<div style="display:flex;align-items:baseline;justify-content:space-between">' +
          '<h4>持倉期間</h4>' +
          '<span class="section-note">綠 = 持有中,灰 = 沒有持有</span>' +
        '</div>' +
        '<div class="sel-strip" id="d-strip" style="margin-top:var(--s-1)"></div>' +
        '<div class="scale-ends"><span>' + F[0].time + '</span><span>' + F[F.length - 1].time + '</span></div>' +
      '</div>' +

      '<div class="factor-side-head" style="padding:var(--s-2) var(--s-4)">' +
        '<div style="display:flex;align-items:baseline;justify-content:space-between">' +
          '<h4>逐日分數</h4>' +
          '<span class="section-note">出場前後 30 個交易日,最新在上</span>' +
        '</div>' +
      '</div>' +
      '<div class="table-scroll" id="d-scroll">' +
        '<table class="kt" style="min-width:300px">' +
          '<thead><tr>' +
            '<th style="width:80px">日期</th>' +
            '<th class="num" style="width:44px">質素</th>' +
            '<th class="num" style="width:44px">動量</th>' +
            '<th class="num" style="width:44px">超賣</th>' +
            '<th class="num" style="width:48px">綜合</th>' +
            '<th style="width:48px">持有</th>' +
          '</tr></thead>' +
          '<tbody id="d-body"></tbody>' +
        '</table>' +
      '</div>';

    document.getElementById('d-strip').innerHTML = F.map(function (f) {
      return '<i class="' + (f.selected ? 'sel-yes' : 'sel-no') + '"></i>';
    }).join('');

    paintFactors(F[S.exitIndex], F, S, null);
  }

  function paintFactors(f, F, S, highlight) {
    var dd = document.getElementById('d-date');
    if (!dd) return;
    dd.textContent = f.time;

    /* 一行同時給三樣:當日分數的橫條、本段走勢的細圖、數字 */
    document.getElementById('d-bars').innerHTML = FDEF.map(function (def, i) {
      var v = f[def.key];
      return '<div class="factor-row" style="grid-template-columns:52px 1fr 56px 34px">' +
        '<span class="factor-name">' + def.name + '</span>' +
        '<span class="factor-bar-track">' +
          '<i class="factor-bar-fill" style="width:' + v + '%;background:' + def.color + '"></i>' +
        '</span>' +
        '<span class="factor-spark" id="d-fs-' + i + '"></span>' +
        '<span class="factor-score">' + v.toFixed(0) + '</span>' +
      '</div>';
    }).join('') +
    '<div class="factor-row" style="grid-template-columns:52px 1fr">' +
      '<span class="factor-name">持有</span>' +
      '<span>' + (f.selected
        ? '<span class="badge-act act-add">持有中</span>'
        : '<span class="badge-act" style="background:var(--bg-3);color:var(--text-3)">沒有持有</span>') +
      '</span>' +
    '</div>';

    FDEF.forEach(function (def, i) {
      KV.factorSpark(document.getElementById('d-fs-' + i),
        F.map(function (x) { return x[def.key]; }), def.color);
    });

    var recent = F.slice(Math.max(0, S.exitIndex - 22), S.exitIndex + 8).reverse();
    document.getElementById('d-body').innerHTML = recent.map(function (x) {
      return '<tr' + (highlight === x.time ? ' class="is-current"' : '') + '>' +
        '<td class="mono dim">' + x.time.slice(5) + '</td>' +
        '<td class="num">' + x.quality.toFixed(0) + '</td>' +
        '<td class="num">' + x.momentum.toFixed(0) + '</td>' +
        '<td class="num">' + x.oversold.toFixed(0) + '</td>' +
        '<td class="num" style="font-weight:700">' + x.composite.toFixed(0) + '</td>' +
        '<td>' + (x.selected ? '<span class="up">●</span> 是' : '<span class="dim">○ 否</span>') + '</td>' +
      '</tr>';
    }).join('');
  }

  /* ============================================================
     右欄二:逐筆交易(整頁唯一一個容許的內部捲軸 —— 表格本質上就是長)
     ============================================================ */
  var table = KV.sortableTable({
    mount: '#trades-table',
    minWidth: '620px',
    defaultSort: 'entryDate',
    defaultDir: 'desc',
    rows: r.trades,
    rowKey: function (t) { return t.id; },
    onRowClick: function (t) { table.select(t.id); openTrade(t); },
    cols: [
      { key: 'sym', label: '代號', width: '58px', get: function (t) { return t.sym; },
        render: function (t) { return '<span class="mono">' + KV.esc(t.sym) + '</span>'; } },
      { key: 'entryDate', label: '進場日', width: '88px', get: function (t) { return Date.parse(t.entryDate); },
        render: function (t) { return '<span class="mono dim">' + t.entryDate + '</span>'; } },
      { key: 'exitDate', label: '出場日', width: '88px', get: function (t) { return Date.parse(t.exitDate); },
        render: function (t) { return '<span class="mono dim">' + t.exitDate + '</span>'; } },
      { key: 'holdDays', label: '持倉日', width: '58px', cls: 'num', get: function (t) { return t.holdDays; },
        render: function (t) { return t.holdDays; } },
      { key: 'pnl', label: '損益', width: '84px', cls: 'num', get: function (t) { return t.pnl; },
        render: function (t) {
          return '<span class="' + KV.cls(t.pnl) + '">' + (t.pnl > 0 ? '+' : '') + KV.money(t.pnl) + '</span>';
        } },
      { key: 'retPct', label: '報酬率', width: '74px', cls: 'num', get: function (t) { return t.retPct; },
        render: function (t) {
          return '<span class="' + KV.cls(t.retPct) + '">' + KV.pct(t.retPct) + '</span>';
        } },
      { key: 'reason', label: '出場原因', width: '116px', get: function (t) { return t.reason; },
        render: function (t) { return '<span class="dim">' + KV.esc(t.reason) + '</span>'; } },
    ],
    foot: function (rows) {
      return '<span>顯示 1–' + rows.length + ' 筆抽樣,整體共 ' + st.tradeCount + ' 筆</span>' +
        '<span>點一行:左邊換蠟燭圖</span>';
    },
  });

  /* 圖上點一個交易日 → 高亮那幾筆並捲到 */
  function highlightDate(m) {
    var ids = {};
    m.buys.concat(m.sells).forEach(function (t) { ids[t.id] = true; });

    var first = null;
    document.querySelectorAll('#trades-table tbody tr[data-rk]').forEach(function (tr) {
      var on = !!ids[tr.getAttribute('data-rk')];
      tr.classList.toggle('is-hit', on);
      if (on && !first) first = tr;
    });
    if (first) first.scrollIntoView({ block: 'nearest' });
  }

  factorHint();
  showEquity();
  window.addEventListener('resize', renderBand);
})();
</script>
</body>
</html>
