<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>趨勢波段 策略詳情 — Karst 原型</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="sp">

<div id="nav-host"></div>

<main class="wrap">

  <header class="page-head">
    <div class="page-title-group">
      <nav class="breadcrumb" aria-label="麵包屑"><a href="index.html">策略總覽</a><span>／</span></nav>
      <h1>趨勢波段</h1>
      <span class="page-en">Trend Swing</span>
      <span class="tag tag-strategy">策略</span>
      <span class="tag tag-live">紙上交易運行中</span>
      <span class="proto-badge">原型・假數據</span>
    </div>
  </header>

  <div class="sp-stack">

    <!-- ============ 現役設定:薄薄一條 ============ -->
    <div class="config-slim" id="config-slim"></div>

    <!-- ============ 頭條數字 ============ -->
    <div class="kpi-row" id="kpis"></div>

    <!-- ============ 淨值走勢 ============ -->
    <section class="sp-panel">
      <div class="sp-head">
        <div class="sp-side">
          <h2>淨值走勢</h2>
          <div class="bench-line" id="equity-bench"></div>
        </div>
        <span class="section-note">點圖選時點 ↓</span>
      </div>
      <div class="sp-body">
        <div class="sp-chart" id="equity-chart"></div>
      </div>
    </section>

    <!-- ============ 選股快照:逐層收窄 + 兩欄名單 ============ -->
    <section class="sp-panel">
      <div class="sp-head">
        <div class="sp-side">
          <h2>選股快照</h2>
          <span class="at-point" id="at-point"></span>
        </div>
        <div class="date-switch" id="pick-vers" role="group" aria-label="以哪個版本檢視"></div>
      </div>
      <div class="sp-sub" id="picks-basis"></div>
      <div class="sp-funnel">
        <div class="sp-funnel-cap">逐層收窄</div>
        <div class="funnel-bar" id="funnel"></div>
      </div>
      <div class="sp-two">
        <div id="picks-left"></div>
        <div id="picks-right"></div>
      </div>
    </section>

    <!-- ============ 版本沿革 ============ -->
    <section class="sp-panel">
      <div class="sp-head">
        <h2>版本沿革</h2>
        <span class="section-note">最新在上</span>
      </div>
      <div class="sp-hist">
        <div>
          <div class="sp-hist-t">策略版本</div>
          <div class="timeline" id="timeline"></div>
        </div>
        <div>
          <div class="sp-hist-t">因子版本</div>
          <div class="factor-hist" id="factor-hist"></div>
        </div>
      </div>
    </section>

    <!-- ============ 歷次運行 ============ -->
    <section class="sp-panel">
      <div class="sp-head">
        <h2>歷次運行</h2>
        <span class="section-note" id="runs-count"></span>
      </div>
      <div class="sp-body flush">
        <table class="kt">
          <thead>
            <tr>
              <th style="width:204px">運行編號</th>
              <th style="width:70px">版本</th>
              <th>參數</th>
              <th class="num" style="width:72px">年化</th>
              <th class="num" style="width:88px">最大回撤</th>
              <th class="num" style="width:62px">勝率</th>
              <th style="width:140px">快照</th>
              <th style="width:64px"></th>
            </tr>
          </thead>
          <tbody id="runs-body"></tbody>
        </table>
      </div>
    </section>

  </div>

  <div id="foot-host"></div>
</main>

<script src="vendor/lightweight-charts.standalone.production.js"></script>
<script src="assets/data.js" charset="utf-8"></script>
<script src="assets/data-ext.js" charset="utf-8"></script>
<script src="assets/app.js" charset="utf-8"></script>
<script>
(function () {
  var K = window.KARST;
  KV.mountNav('strategy.html');
  KV.mountFoot();

  var s = K.strategies.filter(function (x) { return x.id === 'trend-swing'; })[0];
  var qqq = K.benchmarks.QQQ, spy = K.benchmarks.SPY;
  var m = s.metrics;
  var runs = K.trendSwing.runs;
  var cur = runs.filter(function (r) { return r.current; })[0] || runs[0];

  /* ============================================================
     現役設定:一條薄列。歷史最佳降級成尾巴一句
     ============================================================ */
  var W = K.sweep;
  var best = null, bestPos = null;
  W.grid.forEach(function (row, ri) {
    row.forEach(function (c, ci) { if (!best || c.cagr > best.cagr) { best = c; bestPos = [ri, ci]; } });
  });
  function nbhdMean(ri, ci) {
    var sum = 0, n = 0;
    for (var dr = -1; dr <= 1; dr++) for (var dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      var r2 = ri + dr, c2 = ci + dc;
      if (r2 < 0 || c2 < 0 || r2 >= W.rows.length || c2 >= W.cols.length) continue;
      sum += W.grid[r2][c2].cagr; n++;
    }
    return n ? sum / n : 0;
  }
  var bestNbhd = nbhdMean(bestPos[0], bestPos[1]);

  document.getElementById('config-slim').innerHTML =
    '<span class="tag tag-live">現役設定</span>' +
    '<span class="mono" style="font-weight:700">' + KV.esc(cur.ver) + '</span>' +
    K.run.paramList.slice(0, 4).map(function (p) {
      return '<span class="chip"><span class="chip-k">' + KV.esc(p[0]) + '</span>' +
        '<span class="chip-v">' + KV.esc(p[1]) + '</span></span>';
    }).join('') +
    '<span class="section-note mono">' + KV.esc(cur.id) + '・' + KV.esc(cur.snap) + '</span>' +
    '<span class="slim-past">歷史最佳 <span class="mono">N=' + best.n + '・止蝕 ' + best.s +
      '%・年化 ' + KV.pctPlain(best.cagr) + '</span>(鄰域 ' + KV.pctPlain(bestNbhd) +
      ',孤峰)　<a href="sweep.html">看掃描 →</a></span>';

  /* ============================================================
     頭條數字:七格,一行讀完
     ============================================================ */
  var KPIS = [
    { l: '累計報酬', v: KV.pct(m.cumReturn),          c: KV.cls(m.cumReturn), b: 'QQQ ' + KV.pct(qqq.metrics.cumReturn) },
    { l: '年化',     v: KV.pctPlain(m.cagr),          c: KV.cls(m.cagr),      b: 'QQQ ' + KV.pctPlain(qqq.metrics.cagr) },
    { l: '最大回撤', v: KV.pctPlain(m.maxDD),         c: 'down',              b: 'QQQ ' + KV.pctPlain(qqq.metrics.maxDD) },
    { l: '波幅',     v: KV.pctPlain(m.vol),           c: '',                  b: 'QQQ ' + KV.pctPlain(qqq.metrics.vol) },
    { l: 'Sortino',  v: m.sortino.toFixed(2),         c: '',                  b: 'QQQ ' + qqq.metrics.sortino.toFixed(2) },
    { l: '勝率',     v: m.winRate + '%',              c: '',                  b: '盈虧比 ' + m.plRatio.toFixed(1) },
    { l: '交易筆數', v: String(m.trades),             c: '',                  b: K.meta.years + ' 年' },
  ];
  document.getElementById('kpis').innerHTML = KPIS.map(function (k) {
    return '<div class="kpi">' +
      '<div class="kpi-label">' + KV.esc(k.l) + '</div>' +
      '<div class="kpi-value ' + k.c + '">' + KV.esc(k.v) + '</div>' +
      '<div class="kpi-basis">' + KV.esc(k.b) + '</div>' +
    '</div>';
  }).join('');

  /* ============================================================
     淨值走勢圖
     ============================================================ */
  document.getElementById('equity-bench').innerHTML =
    '<span><i style="background:#26a69a"></i>趨勢波段 <b class="up">' + KV.pct(m.cumReturn) + '</b></span>' +
    '<span><i style="background:#b07de0"></i>QQQ <b>' + KV.pct(qqq.metrics.cumReturn) + '</b></span>' +
    '<span><i style="background:#7d869c"></i>SPY <b>' + KV.pct(spy.metrics.cumReturn) + '</b></span>';

  var chartEl = document.getElementById('equity-chart');
  var chart = KV.makeChart(chartEl, chartEl.clientHeight || 320);
  var lSpy = chart.addLineSeries({ color: '#7d869c', lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
  lSpy.setData(KV.zip(K.weeklyDates, spy.equity));
  var lQqq = chart.addLineSeries({ color: '#b07de0', lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
  lQqq.setData(KV.zip(K.weeklyDates, qqq.equity));
  var lStr = chart.addLineSeries({ color: '#26a69a', lineWidth: 2, priceLineVisible: false, lastValueVisible: false });
  lStr.setData(KV.zip(K.weeklyDates, s.equity));
  chart.timeScale().fitContent();

  /* ============================================================
     版本沿革(git log 形態)
     ============================================================ */
  document.getElementById('timeline').innerHTML = K.strategyHistory.map(function (h) {
    return '<div class="tl-item' + (h.current ? ' is-current' : '') + '">' +
      '<div class="tl-head">' +
        '<span class="tl-ver">' + KV.esc(h.ver) + '</span>' +
        (h.current ? '<span class="tag tag-live">現役</span>' : '') +
        '<span class="tl-date">' + KV.esc(h.date) + '</span>' +
        '<span class="tl-meta ' + (h.byKind === 'human' ? 'by-human' : 'by-agent') + '">' +
          (h.byKind === 'human' ? '用戶' : 'agent') + '・' + h.runs + ' 次運行</span>' +
      '</div>' +
      '<div class="tl-sum">' + KV.esc(h.summary) + '</div>' +
    '</div>';
  }).join('');

  document.getElementById('factor-hist').innerHTML = K.factorHistory.map(function (f) {
    var chain = f.versions.map(function (v) {
      return '<span class="' + (v.current ? 'fh-cur' : '') + '" title="' + KV.esc(v.date) + '　' +
        KV.esc(v.summary) + '">' + KV.esc(v.ver) + '</span>';
    }).join('<span class="fh-note"> ← </span>');
    return '<div class="fh-row">' +
      '<div class="fh-name">' + KV.esc(f.name) + '</div>' +
      '<div class="fh-chain">' + chain + '</div>' +
      '<div class="fh-note">' + KV.esc(f.versions[0].date + '　' + f.versions[0].summary) + '</div>' +
    '</div>';
  }).join('');

  /* ---- 歷次運行 ---- */
  document.getElementById('runs-count').textContent = runs.length + ' 次';
  document.getElementById('runs-body').innerHTML = runs.map(function (r) {
    return '<tr class="' + (r.current ? 'is-current' : '') + '">' +
      '<td class="mono">' + KV.esc(r.id) + (r.current ? ' <span class="tag tag-current">本次</span>' : '') + '</td>' +
      '<td class="mono">' + KV.esc(r.ver) + '</td>' +
      '<td title="' + KV.esc(r.params) + '">' + KV.esc(r.params) + '</td>' +
      '<td class="num ' + KV.cls(r.cagr) + '">' + KV.pctPlain(r.cagr) + '</td>' +
      '<td class="num down">' + KV.pctPlain(r.mdd) + '</td>' +
      '<td class="num">' + r.win + '%</td>' +
      '<td class="mono dim">' + KV.esc(r.snap) + '</td>' +
      '<td>' + (r.current ? '<a href="run.html">查看 →</a>' : '<span class="dim">查看</span>') + '</td>' +
    '</tr>';
  }).join('');

  /* ============================================================
     選股快照 —— 由圖上的時點驅動
     ============================================================ */
  var P = K.picks;
  var curVer = P.versions[0].id;
  var curDate = K.weeklyDates[K.weeklyDates.length - 1];

  var FUNNEL_COLOR = ['#6b7488', '#4a9eff', '#26a69a', '#f0a83c'];
  var FUNNEL_LABEL = ['範圍', '基本面', '技術', '持倉'];
  var ST_CLS = { '持倉': 'st-hold', '入選': 'st-in', '觀察': 'st-watch', '未過': 'st-out' };

  document.getElementById('pick-vers').innerHTML = P.versions.map(function (v) {
    return '<button type="button" data-ver="' + v.id + '" ' +
      'aria-pressed="' + (v.id === curVer ? 'true' : 'false') + '">' +
      KV.esc(v.id) + (v.live ? '・現役' : '') + '</button>';
  }).join('');

  var PICK_HEAD =
    '<thead><tr>' +
      '<th style="width:60px">代號</th>' +
      '<th>名稱</th>' +
      '<th style="width:88px">行業</th>' +
      '<th class="num" style="width:46px">質素</th>' +
      '<th class="num" style="width:46px">動量</th>' +
      '<th class="num" style="width:46px">超賣</th>' +
      '<th class="num" style="width:52px">綜合</th>' +
      '<th style="width:58px">基本面</th>' +
      '<th style="width:50px">技術</th>' +
      '<th style="width:68px">狀態</th>' +
    '</tr></thead>';

  function gateCell(pass, shown) {
    if (!shown) return '<td><span class="dim">—</span></td>';
    return '<td class="' + (pass ? 'gate-yes' : 'gate-no') + '" title="' +
      (pass ? '過' : '不過') + '">' + (pass ? '✓' : '✗') + '</td>';
  }

  function picksTable(rows) {
    return '<table class="kt">' + PICK_HEAD + '<tbody>' + rows.map(function (r) {
      return '<tr>' +
        '<td class="mono">' + KV.esc(r.sym) + '</td>' +
        '<td title="' + KV.esc(r.name) + '">' + KV.esc(r.name) + '</td>' +
        '<td class="dim" title="' + KV.esc(r.sector) + '">' + KV.esc(r.sector) + '</td>' +
        '<td class="num">' + r.quality.toFixed(0) + '</td>' +
        '<td class="num">' + r.momentum.toFixed(0) + '</td>' +
        '<td class="num">' + r.oversold.toFixed(0) + '</td>' +
        '<td class="num" style="font-weight:700">' + r.composite.toFixed(0) + '</td>' +
        gateCell(r.passFund, true) +
        gateCell(r.passTech, r.passFund) +
        '<td><span class="st ' + ST_CLS[r.status] + '">' + r.status + '</span></td>' +
      '</tr>';
    }).join('') + '</tbody></table>';
  }

  function render() {
    var snap = P.snapshot(curVer, curDate);
    var V = snap.version;

    document.getElementById('at-point').textContent = '時點 ' + curDate;

    document.getElementById('picks-basis').innerHTML =
      '<span class="mono">' + KV.esc(V.id) + '</span>' +
      (V.live ? '' : '<span class="tag tag-current">非現役設定</span>') +
      '<span class="mono">' + KV.esc(V.params) + '</span>' +
      '<span>門檻 質素 ≥ ' + V.gates.quality + '・動量 ≥ ' + V.gates.momentum + '</span>' +
      '<span>分數 0–100</span>';

    /* 一條橫向漸縮的分段條:每段闊度按隻數比例,數字寫在段內、關卡名在段下 */
    document.getElementById('funnel').innerHTML = snap.funnel.map(function (f, i) {
      var prev = i ? snap.funnel[i - 1].count : 0;
      var keep = i ? Math.round(f.count / prev * 1000) / 10 : 100;
      return '<div class="fb-seg" style="flex:' + f.count + ' 1 74px" ' +
          'title="' + KV.esc(f.label + '　' + f.hint) + '">' +
          '<div class="fb-block" style="background:' + FUNNEL_COLOR[i] + '">' +
            '<span class="fb-num">' + f.count + '<small>隻</small></span>' +
            '<span class="fb-keep">' + (i ? '剩 ' + keep + '%' : '全部') + '</span>' +
          '</div>' +
          '<div class="fb-lab">' + KV.esc(FUNNEL_LABEL[i] || f.label) +
            (i ? '　−' + (prev - f.count) : '') + '</div>' +
        '</div>';
    }).join('');

    var rows = snap.rows;
    var half = Math.ceil(rows.length / 2);
    document.getElementById('picks-left').innerHTML = picksTable(rows.slice(0, half));
    document.getElementById('picks-right').innerHTML = picksTable(rows.slice(half));
  }

  /* 圖上點一日 = 選定時點 */
  function isoOf(t) {
    if (typeof t === 'string') return t;
    if (t && t.year) {
      return t.year + '-' + String(t.month).padStart(2, '0') + '-' + String(t.day).padStart(2, '0');
    }
    return null;
  }
  chart.subscribeClick(function (param) {
    var iso = isoOf(param.time);
    if (!iso) return;
    curDate = iso;
    render();
  });

  document.getElementById('pick-vers').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-ver]');
    if (!b) return;
    curVer = b.getAttribute('data-ver');
    this.querySelectorAll('button').forEach(function (o) {
      o.setAttribute('aria-pressed', o === b ? 'true' : 'false');
    });
    render();
  });

  render();
})();
</script>
</body>
</html>
