<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>趨勢波段 策略詳情 — Karst 原型</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="fit">

<div id="nav-host"></div>

<main class="wrap">

  <header class="page-head">
    <div class="page-head-row">
      <div>
        <div class="page-title-group">
          <nav class="breadcrumb" aria-label="麵包屑" style="margin:0"><a href="index.html">策略總覽</a><span>／</span></nav>
          <h1>趨勢波段</h1>
          <span class="page-en">Trend Swing</span>
          <span class="tag tag-strategy">策略</span>
          <span class="tag tag-live">紙上交易運行中</span>
          <span class="proto-badge">原型・假數據</span>
        </div>
      </div>
    </div>
  </header>

  <!-- ============ 薄薄一條現役設定摘要 ============ -->
  <div class="config-slim" id="config-slim"></div>

  <div class="fit-main" style="grid-template-columns:minmax(0,46fr) minmax(0,54fr)">

    <!-- ================= 左欄:圖 + 漏斗 + 版本沿革 ================= -->
    <div class="fit-col">

      <div class="fit-panel" style="flex:none">
        <div class="fit-panel-head">
          <h2 style="font-size:var(--fs-md)">淨值走勢</h2>
          <div class="bench-line" id="equity-bench"></div>
        </div>
        <div class="fit-panel-body" style="overflow:hidden">
          <div class="chart-box" id="equity-chart"></div>
          <div style="padding:var(--s-2) var(--s-4) var(--s-3)">
            <div class="section-note" id="metric-line"></div>
            <div class="section-note" style="margin-top:2px;color:var(--accent)">
              點圖上任何一日 = 選定時點,右邊選股快照即時跳到該日。
            </div>
          </div>
        </div>
      </div>

      <div class="fit-panel" style="flex:none">
        <div class="fit-panel-head">
          <h3>逐層收窄</h3>
          <span class="section-note" id="funnel-note"></span>
        </div>
        <div class="fit-panel-body" style="overflow:hidden">
          <div class="funnel-line" id="funnel"></div>
        </div>
      </div>

      <div class="fit-panel fit-grow">
        <div class="tabs" role="tablist" aria-label="版本與運行">
          <button class="tab-btn" role="tab" id="tab-hist" aria-selected="true" aria-controls="p-hist">版本沿革</button>
          <button class="tab-btn" role="tab" id="tab-runs" aria-selected="false" aria-controls="p-runs">歷次運行</button>
        </div>
        <div class="fit-panel-body">
          <div class="tab-panel" id="p-hist" role="tabpanel" aria-labelledby="tab-hist">
            <div class="timeline" id="timeline"></div>
            <div class="factor-hist" id="factor-hist"></div>
          </div>
          <div class="tab-panel" id="p-runs" role="tabpanel" aria-labelledby="tab-runs" hidden>
            <table class="kt" style="min-width:640px">
              <thead>
                <tr>
                  <th style="width:150px">運行編號</th>
                  <th style="width:64px">版本</th>
                  <th style="width:210px">參數摘要</th>
                  <th class="num" style="width:66px">年化</th>
                  <th class="num" style="width:76px">最大回撤</th>
                  <th class="num" style="width:56px">勝率</th>
                  <th style="width:124px">數據快照</th>
                  <th style="width:60px"></th>
                </tr>
              </thead>
              <tbody id="runs-body"></tbody>
            </table>
          </div>
        </div>
      </div>

    </div>

    <!-- ================= 右欄:選股快照 ================= -->
    <div class="fit-col">
      <div class="fit-panel fit-grow">
        <div class="fit-panel-head">
          <div>
            <h2 style="font-size:var(--fs-md)">選股快照</h2>
            <div class="section-note" id="picks-basis" style="margin-top:2px"></div>
          </div>
          <div style="display:flex;align-items:center;gap:var(--s-3);flex-wrap:wrap">
            <span class="at-point" id="at-point"></span>
            <div class="date-switch" id="pick-vers" role="group" aria-label="以哪個版本檢視"></div>
          </div>
        </div>
        <div class="fit-panel-body">
          <table class="kt" style="min-width:820px">
            <thead>
              <tr>
                <th style="width:66px">代號</th>
                <th style="width:120px">名稱</th>
                <th style="width:100px">行業</th>
                <th class="num" style="width:66px">質素分</th>
                <th class="num" style="width:66px">動量分</th>
                <th class="num" style="width:66px">超賣度</th>
                <th class="num" style="width:66px">綜合分</th>
                <th style="width:80px">基本面關</th>
                <th style="width:74px">技術關</th>
                <th style="width:76px">狀態</th>
              </tr>
            </thead>
            <tbody id="picks-body"></tbody>
          </table>
        </div>
        <div class="table-foot" style="flex:none">
          <span id="picks-note"></span>
          <span id="picks-foot"></span>
        </div>
      </div>
    </div>

  </div>

  <div id="foot-host"></div>
</main>

<script src="vendor/lightweight-charts.standalone.production.js"></script>
<script src="assets/data.js" charset="utf-8"></script>
<script src="assets/data-ext.js" charset="utf-8"></script>
<script src="assets/app.js" charset="utf-8"></script>
<script>
(function () {
  var K = window.KARST;
  KV.mountNav('strategy.html');
  KV.mountFoot();

  var s = K.strategies.filter(function (x) { return x.id === 'trend-swing'; })[0];
  var qqq = K.benchmarks.QQQ, spy = K.benchmarks.SPY;
  var m = s.metrics;
  var runs = K.trendSwing.runs;
  var cur = runs.filter(function (r) { return r.current; })[0] || runs[0];

  /* ============================================================
     薄摘要列:現役設定 + 降級的歷史最佳
     ============================================================ */
  var W = K.sweep;
  var best = null, bestPos = null;
  W.grid.forEach(function (row, ri) {
    row.forEach(function (c, ci) { if (!best || c.cagr > best.cagr) { best = c; bestPos = [ri, ci]; } });
  });
  function nbhdMean(ri, ci) {
    var sum = 0, n = 0;
    for (var dr = -1; dr <= 1; dr++) for (var dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      var r2 = ri + dr, c2 = ci + dc;
      if (r2 < 0 || c2 < 0 || r2 >= W.rows.length || c2 >= W.cols.length) continue;
      sum += W.grid[r2][c2].cagr; n++;
    }
    return n ? sum / n : 0;
  }
  var bestNbhd = nbhdMean(bestPos[0], bestPos[1]);

  document.getElementById('config-slim').innerHTML =
    '<span class="tag tag-live">現役設定</span>' +
    '<span class="mono" style="font-weight:700">' + KV.esc(cur.ver) + '</span>' +
    K.run.paramList.slice(0, 4).map(function (p) {
      return '<span class="chip"><span class="chip-k">' + KV.esc(p[0]) + '</span>' +
        '<span class="chip-v">' + KV.esc(p[1]) + '</span></span>';
    }).join('') +
    '<span class="section-note">運行 ' + KV.esc(cur.id) + '・快照 ' + KV.esc(cur.snap) + '</span>' +
    '<span class="slim-past">歷史最佳(僅供參考)　<span class="mono">N=' + best.n + '・止蝕 ' + best.s +
      '%・年化 ' + KV.pctPlain(best.cagr) + '</span>　鄰域平均只有 ' + KV.pctPlain(bestNbhd) +
      ',屬孤峰,從來沒有實際跟隨過。<a href="sweep.html">看掃描 →</a></span>';

  /* ============================================================
     淨值走勢圖(基準只在圖例列出現,不再霸一行大卡)
     ============================================================ */
  document.getElementById('equity-bench').innerHTML =
    '<span><i style="background:#26a69a"></i>趨勢波段 <b class="up">' + KV.pct(m.cumReturn) +
      '</b>・年化 <b>' + KV.pctPlain(m.cagr) + '</b></span>' +
    '<span><i style="background:#b07de0"></i>QQQ <b>' + KV.pct(qqq.metrics.cumReturn) +
      '</b>・年化 <b>' + KV.pctPlain(qqq.metrics.cagr) + '</b></span>' +
    '<span><i style="background:#7d869c"></i>SPY <b>' + KV.pct(spy.metrics.cumReturn) +
      '</b>・年化 <b>' + KV.pctPlain(spy.metrics.cagr) + '</b></span>';

  document.getElementById('metric-line').textContent =
    '最大回撤 ' + KV.pctPlain(m.maxDD) + '(QQQ ' + KV.pctPlain(qqq.metrics.maxDD) + ',較淺)' +
    '・Sortino ' + m.sortino.toFixed(2) +
    '・勝率 ' + m.winRate + '% ／ 盈虧比 ' + m.plRatio.toFixed(1) +
    '・共 ' + m.trades + ' 筆交易';

  var chartEl = document.getElementById('equity-chart');
  var chart = KV.makeChart(chartEl, 236);
  var lSpy = chart.addLineSeries({ color: '#7d869c', lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
  lSpy.setData(KV.zip(K.weeklyDates, spy.equity));
  var lQqq = chart.addLineSeries({ color: '#b07de0', lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
  lQqq.setData(KV.zip(K.weeklyDates, qqq.equity));
  var lStr = chart.addLineSeries({ color: '#26a69a', lineWidth: 2, priceLineVisible: false, lastValueVisible: false });
  lStr.setData(KV.zip(K.weeklyDates, s.equity));
  chart.timeScale().fitContent();

  /* ============================================================
     版本沿革(git log 形態)
     ============================================================ */
  document.getElementById('timeline').innerHTML = K.strategyHistory.map(function (h) {
    return '<div class="tl-item' + (h.current ? ' is-current' : '') + '">' +
      '<div class="tl-head">' +
        '<span class="tl-ver">' + KV.esc(h.ver) + '</span>' +
        (h.current ? '<span class="tag tag-live">現役</span>' : '') +
        '<span class="tl-date">' + KV.esc(h.date) + '</span>' +
      '</div>' +
      '<div class="tl-sum">' + KV.esc(h.summary) + '</div>' +
      '<div class="tl-meta">' +
        '<span class="' + (h.byKind === 'human' ? 'by-human' : 'by-agent') + '">' +
          (h.byKind === 'human' ? '用戶' : 'agent') + '改' + '</span>' +
        '<span>' + h.runs + ' 次運行掛在這一版之下</span>' +
      '</div>' +
    '</div>';
  }).join('');

  document.getElementById('factor-hist').innerHTML =
    '<div style="color:var(--text-2);font-weight:700;border-top:1px solid var(--line);' +
      'padding-top:var(--s-3)">因子版本</div>' +
    K.factorHistory.map(function (f) {
      var chain = f.versions.map(function (v) {
        return '<span class="' + (v.current ? 'fh-cur' : '') + '" title="' + KV.esc(v.date) + '　' +
          KV.esc(v.summary) + '">' + KV.esc(v.ver) + '</span>';
      }).join('<span class="fh-note"> ← </span>');
      return '<div class="fh-name">' + KV.esc(f.name) + '</div>' +
        '<div class="fh-chain">' + chain + '</div>' +
        '<div class="fh-note">' + KV.esc(f.versions[0].date + '　' + f.versions[0].summary) + '</div>';
    }).join('');

  KV.initTabs('.tabs');

  /* ---- 歷次運行 ---- */
  document.getElementById('runs-body').innerHTML = runs.map(function (r) {
    return '<tr class="' + (r.current ? 'is-current' : '') + '">' +
      '<td class="mono">' + KV.esc(r.id) + (r.current ? ' <span class="tag tag-current">本次</span>' : '') + '</td>' +
      '<td class="mono">' + KV.esc(r.ver) + '</td>' +
      '<td title="' + KV.esc(r.params) + '">' + KV.esc(r.params) + '</td>' +
      '<td class="num ' + KV.cls(r.cagr) + '">' + KV.pctPlain(r.cagr) + '</td>' +
      '<td class="num down">' + KV.pctPlain(r.mdd) + '</td>' +
      '<td class="num">' + r.win + '%</td>' +
      '<td class="mono dim">' + KV.esc(r.snap) + '</td>' +
      '<td>' + (r.current ? '<a href="run.html">查看 →</a>' : '<span class="dim">查看</span>') + '</td>' +
    '</tr>';
  }).join('');

  /* ============================================================
     選股快照 —— 由圖上的時點驅動
     ============================================================ */
  var P = K.picks;
  var curVer = P.versions[0].id;
  var curDate = K.weeklyDates[K.weeklyDates.length - 1];

  var FUNNEL_COLOR = ['#6b7488', '#4a9eff', '#26a69a', '#f0a83c'];
  var ST_CLS = { '持倉': 'st-hold', '入選': 'st-in', '觀察': 'st-watch', '未過': 'st-out' };

  document.getElementById('pick-vers').innerHTML = P.versions.map(function (v) {
    return '<button type="button" data-ver="' + v.id + '" ' +
      'aria-pressed="' + (v.id === curVer ? 'true' : 'false') + '">' + KV.esc(v.label) + '</button>';
  }).join('');

  function render() {
    var snap = P.snapshot(curVer, curDate);
    var V = snap.version;
    var scope = snap.funnel[0].count;

    document.getElementById('at-point').textContent = '時點 ' + curDate;

    document.getElementById('picks-basis').innerHTML =
      '時點:<b class="mono">' + KV.esc(curDate) + '</b>・基於 ' +
      (V.live
        ? '<b class="up">現役設定 ' + KV.esc(V.id) + '</b>'
        : '<b class="down">' + KV.esc(V.label) + '(不是現役設定)</b>') +
      '(' + KV.esc(V.params) + ')';

    document.getElementById('funnel-note').textContent =
      curDate + '・' + V.id + ' 門檻 質素 ≥ ' + V.gates.quality + '、動量 ≥ ' + V.gates.momentum;

    /* 一行四格:數字大字、標籤細字,格與格之間用細箭嘴寫明剩幾多 */
    document.getElementById('funnel').innerHTML = snap.funnel.map(function (f, i) {
      var prev = i ? snap.funnel[i - 1].count : 0;
      var keep = i ? Math.round(f.count / prev * 1000) / 10 : 0;
      var arrow = i
        ? '<div class="fl-arrow" aria-hidden="true">→<small>剩 ' + keep + '%</small></div>'
        : '';
      return arrow +
        '<div class="fl-step">' +
          '<div class="fl-num" style="color:' + FUNNEL_COLOR[i] + '">' + f.count +
            '<small>隻</small></div>' +
          '<div class="fl-lab" title="' + KV.esc(f.hint) + '">' + KV.esc(f.label) +
            (i ? '<span class="dim">・−' + (prev - f.count) + '</span>' : '') + '</div>' +
        '</div>';
    }).join('');

    var rows = snap.rows;
    document.getElementById('picks-body').innerHTML = rows.map(function (r) {
      return '<tr>' +
        '<td class="mono">' + KV.esc(r.sym) + '</td>' +
        '<td title="' + KV.esc(r.name) + '">' + KV.esc(r.name) + '</td>' +
        '<td class="dim">' + KV.esc(r.sector) + '</td>' +
        '<td class="num">' + r.quality.toFixed(0) + '</td>' +
        '<td class="num">' + r.momentum.toFixed(0) + '</td>' +
        '<td class="num">' + r.oversold.toFixed(0) + '</td>' +
        '<td class="num" style="font-weight:700">' + r.composite.toFixed(0) + '</td>' +
        '<td class="' + (r.passFund ? 'gate-yes' : 'gate-no') + '">' +
          (r.passFund ? '✓ 過' : '✗ 不過') + '</td>' +
        '<td class="' + (r.passTech ? 'gate-yes' : 'gate-no') + '">' +
          (r.passFund ? (r.passTech ? '✓ 過' : '✗ 不過') : '<span class="dim">—</span>') + '</td>' +
        '<td><span class="st ' + ST_CLS[r.status] + '">' + r.status + '</span></td>' +
      '</tr>';
    }).join('');

    var counts = { '持倉': 0, '入選': 0, '觀察': 0, '未過': 0 };
    rows.forEach(function (r) { counts[r.status]++; });
    document.getElementById('picks-note').textContent =
      '表列 ' + rows.length + ' 隻示意樣本・持倉 ' + counts['持倉'] + '、入選 ' + counts['入選'] +
      '、觀察 ' + counts['觀察'] + '、未過 ' + counts['未過'];
    document.getElementById('picks-foot').textContent =
      '當日範圍共 ' + scope + ' 隻・按綜合分由高至低・持倉那幾行是當日重新評分';
  }

  /* 圖上點一日 = 選定時點 */
  function isoOf(t) {
    if (typeof t === 'string') return t;
    if (t && t.year) {
      return t.year + '-' + String(t.month).padStart(2, '0') + '-' + String(t.day).padStart(2, '0');
    }
    return null;
  }
  chart.subscribeClick(function (param) {
    var iso = isoOf(param.time);
    if (!iso) return;
    curDate = iso;
    render();
  });

  document.getElementById('pick-vers').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-ver]');
    if (!b) return;
    curVer = b.getAttribute('data-ver');
    this.querySelectorAll('button').forEach(function (o) {
      o.setAttribute('aria-pressed', o === b ? 'true' : 'false');
    });
    render();
  });

  render();
})();
</script>
</body>
</html>
