<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>策略總覽 — Karst 原型</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="fit">

<div id="nav-host"></div>

<main class="wrap">

  <header class="page-head">
    <div class="page-head-row">
      <div>
        <div class="page-title-group">
          <h1>策略總覽</h1>
          <span class="proto-badge">原型・假數據</span>
        </div>
        <p class="page-sub">一張平表,可跨全表排序。上面按類型篩選、按名稱搜尋。策略由二十套加到幾百套,這個看法都不用改。</p>
      </div>
    </div>
  </header>

  <!-- ============ 篩選列:類型晶片(可多選)+ 名稱搜尋 ============ -->
  <div class="filter-bar">
    <div class="chip-row" id="type-chips" role="group" aria-label="按策略類型篩選"></div>
    <div class="chip-sep" aria-hidden="true"></div>
    <input class="search-box" id="q" type="search" placeholder="搜尋策略名稱" aria-label="按名稱搜尋策略" autocomplete="off">
    <span class="filter-count" id="filter-count"></span>
  </div>

  <div class="fit-main" style="grid-template-columns:minmax(0,62fr) minmax(0,38fr)">

    <!-- ============ 左欄:全量策略平表 ============ -->
    <section class="fit-panel" aria-labelledby="h-all">
      <h2 id="h-all" class="sr-only">全部策略</h2>
      <div class="fit-panel-body" id="table-wrap">
        <table class="kt flat" id="grp-table">
          <thead>
            <tr>
              <th class="sortable" data-key="name" style="width:168px">名稱</th>
              <th class="sortable" data-key="type" style="width:104px">類型</th>
              <th class="sortable num" data-key="vsBench" style="width:104px">對基準</th>
              <th class="sortable num" data-key="cagr" style="width:70px">年化</th>
              <th class="sortable num" data-key="maxDD" style="width:84px">最大回撤</th>
              <th class="sortable num" data-key="winRate" style="width:110px">勝率 ／ 盈虧比</th>
              <th style="width:92px">迷你走勢</th>
              <th style="width:40px"><span class="dim" title="開啟策略頁">開啟</span></th>
            </tr>
          </thead>
          <tbody id="grp-body"></tbody>
        </table>
      </div>
      <div class="table-foot">
        <span id="page-foot"></span>
        <span>實線本策略、虛線 QQQ,同基期 100</span>
      </div>
    </section>

    <!-- ============ 右欄:緊湊詳情卡 + 最近運行 ============ -->
    <div class="fit-col">
      <aside class="dcard" id="detail" aria-live="polite" aria-label="策略詳情"></aside>
      <div class="lastrun-line" id="lastrun"></div>
    </div>

  </div>

  <div id="foot-host"></div>
</main>

<script src="vendor/lightweight-charts.standalone.production.js"></script>
<script src="assets/data.js" charset="utf-8"></script>
<script src="assets/data-ext.js" charset="utf-8"></script>
<script src="assets/app.js" charset="utf-8"></script>
<script>
(function () {
  var K = window.KARST;
  KV.mountNav('index.html');
  KV.mountFoot();

  var qqq = K.benchmarks.QQQ, spy = K.benchmarks.SPY;
  var ALL = K.allStrategies;
  var byId = {};
  ALL.forEach(function (s) { byId[s.id] = s; });

  function vsBench(s) { return Math.round((s.metrics.cumReturn - qqq.metrics.cumReturn) * 10) / 10; }

  /* 原型只做了趨勢波段一頁,其餘策略的入口一律指去同一頁示意 */
  var STRATEGY_HREF = 'strategy.html';

  /* ============================================================
     篩選狀態:類型多選 + 名稱搜尋
     ============================================================ */
  var picked = {};          /* 空 = 全部 */
  var query = '';
  var selectedId = null;

  function pickedCount() { return Object.keys(picked).length; }

  function visibleRows() {
    var q = query.trim().toLowerCase();
    return ALL.filter(function (s) {
      if (pickedCount() && !picked[s.type]) return false;
      if (!q) return true;
      return s.name.toLowerCase().indexOf(q) >= 0 ||
             (s.en || '').toLowerCase().indexOf(q) >= 0;
    });
  }

  /* ---- 類型晶片 ---- */
  function mountChips() {
    var counts = {};
    ALL.forEach(function (s) { counts[s.type] = (counts[s.type] || 0) + 1; });

    var html =
      '<button type="button" class="fchip" data-t="" aria-pressed="true">全部' +
        '<span class="fchip-n">' + ALL.length + '</span></button>';
    html += K.strategyTypes.map(function (t) {
      return '<button type="button" class="fchip" data-t="' + t.id + '" aria-pressed="false">' +
        KV.esc(t.name) + '<span class="fchip-n">' + (counts[t.id] || 0) + '</span></button>';
    }).join('');
    document.getElementById('type-chips').innerHTML = html;

    document.getElementById('type-chips').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-t]');
      if (!b) return;
      var t = b.getAttribute('data-t');
      if (!t) picked = {};                                   /* 按「全部」= 清空篩選 */
      else if (picked[t]) delete picked[t];
      else picked[t] = true;
      paintChips();
      renderTable();
    });
  }

  function paintChips() {
    var none = pickedCount() === 0;
    document.querySelectorAll('#type-chips .fchip').forEach(function (b) {
      var t = b.getAttribute('data-t');
      var on = t ? !!picked[t] : none;
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }

  document.getElementById('q').addEventListener('input', function () {
    query = this.value;
    renderTable();
  });

  /* ============================================================
     右欄:緊湊詳情卡
     ============================================================ */
  function renderDetail(id) {
    var host = document.getElementById('detail');
    var lr = document.getElementById('lastrun');
    var s = byId[id];

    if (!s) {
      host.innerHTML = '<div class="detail-empty">在左邊點一行,這裡出該策略的詳情。</div>';
      lr.innerHTML = '';
      return;
    }

    var m = s.metrics;
    var vb = vsBench(s);
    var vc = Math.round((m.cagr - qqq.metrics.cagr) * 10) / 10;
    var ddBetter = m.maxDD > qqq.metrics.maxDD;   /* 回撤是負數,數值大即是回撤淺 */

    host.innerHTML =
      '<div class="dc-top">' +
        '<span class="dc-name">' + KV.esc(s.name) + '</span>' +
        '<span class="dc-en">' + KV.esc(s.en) + '</span>' +
        '<span class="tag tag-type">' + KV.esc(s.typeName) + '</span>' +
        '<span class="dc-sum" title="' + KV.esc(s.ver + '・' + s.paramSummary) + '">' +
          KV.esc(s.ver) + '・' + KV.esc(s.paramSummary) + '</span>' +
      '</div>' +

      '<div class="dc-metrics">' +
        '<div class="dc-m">' +
          '<div class="dc-l">累計 對基準</div>' +
          '<div class="dc-v ' + KV.cls(vb) + '">' + KV.pp(vb) + '</div>' +
          '<div class="dc-b">本策略 ' + KV.pct(m.cumReturn) + '</div>' +
        '</div>' +
        '<div class="dc-m">' +
          '<div class="dc-l">年化回報</div>' +
          '<div class="dc-v ' + KV.cls(m.cagr) + '">' + KV.pctPlain(m.cagr) + '</div>' +
          '<div class="dc-b">對 QQQ ' + KV.pp(vc) + '</div>' +
        '</div>' +
        '<div class="dc-m">' +
          '<div class="dc-l">最大回撤</div>' +
          '<div class="dc-v down">' + KV.pctPlain(m.maxDD) + '</div>' +
          '<div class="dc-b">QQQ ' + KV.pctPlain(qqq.metrics.maxDD) + '・' +
            (ddBetter ? '較淺' : '較深') + '</div>' +
        '</div>' +
        '<div class="dc-m">' +
          '<div class="dc-l">勝率 ／ 盈虧比</div>' +
          '<div class="dc-v sm">' + m.winRate + '<span class="dim" style="font-weight:400"> ／ </span>' +
            m.plRatio.toFixed(1) + '</div>' +
          '<div class="dc-b">共 ' + m.trades + ' 筆交易</div>' +
        '</div>' +
      '</div>' +

      '<div>' +
        '<div class="dc-chart" id="detail-spark"></div>' +
        '<div class="bench-line" style="margin-top:var(--s-2)">' +
          '<span><i style="background:' + (m.cumReturn >= 0 ? 'var(--up)' : 'var(--down)') + '"></i>' +
            KV.esc(s.name) + ' <b class="' + KV.cls(m.cumReturn) + '">' + KV.pct(m.cumReturn) +
            '</b>・年化 <b>' + KV.pctPlain(m.cagr) + '</b></span>' +
          '<span><i style="background:var(--bench-spy)"></i>QQQ <b>' + KV.pct(qqq.metrics.cumReturn) +
            '</b>・年化 <b>' + KV.pctPlain(qqq.metrics.cagr) + '</b></span>' +
          '<span title="圖上只畫了本策略與 QQQ 兩條線"><i style="background:var(--bg-4)"></i>' +
            'SPY <b>' + KV.pct(spy.metrics.cumReturn) + '</b>・年化 <b>' +
            KV.pctPlain(spy.metrics.cagr) + '</b></span>' +
        '</div>' +
      '</div>' +

      '<a class="btn btn-primary dc-cta" href="' + STRATEGY_HREF + '">開啟策略頁 →</a>';

    KV.sparkline(document.getElementById('detail-spark'), s.equity, qqq.equity);

    /* 運行編號同快照編號對用戶無用,收起;只留「幾時跑過、跑出幾多」 */
    lr.innerHTML =
      '最近運行 <b>' + KV.esc(s.lastRun) + '</b>・年化 <b>' + KV.pctPlain(m.cagr) + '</b>' +
      (s.id === 'trend-swing' ? '　<span class="tag tag-live">紙上交易運行中</span>' : '');
  }

  /* ============================================================
     左欄:平表,跨全表排序
     ============================================================ */
  var sortKey = 'vsBench', sortDir = 'desc';

  var GETTERS = {
    name: function (s) { return s.name; },
    type: function (s) { return s.typeName; },
    vsBench: vsBench,
    cagr: function (s) { return s.metrics.cagr; },
    maxDD: function (s) { return s.metrics.maxDD; },
    winRate: function (s) { return s.metrics.winRate; },
  };

  function renderTable() {
    var rows = visibleRows();
    var get = GETTERS[sortKey];
    rows = rows.slice().sort(function (a, b) {
      var x = get(a), y = get(b);
      if (typeof x === 'string') return sortDir === 'asc' ? x.localeCompare(y) : y.localeCompare(x);
      return sortDir === 'asc' ? x - y : y - x;
    });

    var sparkJobs = [];
    var html = rows.map(function (s) {
      var m = s.metrics;
      var vb = vsBench(s);
      var sparkId = 'sp-' + s.id;
      sparkJobs.push([sparkId, s]);

      return '<tr data-id="' + KV.esc(s.id) + '" tabindex="0" role="button" ' +
          'class="row-clickable' + (s.id === selectedId ? ' is-picked' : '') + '" ' +
          'aria-pressed="' + (s.id === selectedId ? 'true' : 'false') + '">' +
        '<td title="' + KV.esc(s.name) + '">' + KV.esc(s.name) +
          (s.demo ? '<span class="demo-mark">示意</span>' : '') + '</td>' +
        '<td><span class="tag tag-type">' + KV.esc(s.typeName) + '</span></td>' +
        '<td class="num ' + KV.cls(vb) + '">' + KV.pp(vb) + '</td>' +
        '<td class="num ' + KV.cls(m.cagr) + '">' + KV.pctPlain(m.cagr) + '</td>' +
        '<td class="num down">' + KV.pctPlain(m.maxDD) + '</td>' +
        '<td class="num">' + m.winRate + '%<span class="dim"> ／ </span>' + m.plRatio.toFixed(1) + '</td>' +
        '<td><span class="row-spark" id="' + sparkId + '"></span></td>' +
        '<td><a class="row-go" href="' + STRATEGY_HREF + '" data-go="1" ' +
          'aria-label="開啟 ' + KV.esc(s.name) + ' 策略頁" title="開啟策略頁">→</a></td>' +
      '</tr>';
    }).join('');

    document.getElementById('grp-body').innerHTML = html ||
      '<tr><td colspan="8" class="dim" style="text-align:center;padding:var(--s-6) 0">' +
      '沒有符合的策略。清一清類型或搜尋字。</td></tr>';

    sparkJobs.forEach(function (j) {
      var el = document.getElementById(j[0]);
      if (el) KV.sparkline(el, j[1].equity, qqq.equity);
    });

    /* 點行選中。箭嘴是快捷入口,點它直接開頁,不當作選中 */
    document.querySelectorAll('#grp-body tr[data-id]').forEach(function (tr) {
      function go() { select(tr.getAttribute('data-id')); }
      tr.addEventListener('click', function (e) {
        if (e.target.closest('[data-go]')) return;
        go();
      });
      tr.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); }
      });
    });

    /* 分頁腳:現時二十套一屏放得下,所以一頁到底;數目再大就在這裡分頁 */
    document.getElementById('page-foot').textContent = rows.length
      ? ('顯示 1–' + rows.length + ' / 共 ' + rows.length + ' 套' +
         (rows.length < ALL.length ? '(由 ' + ALL.length + ' 套篩出)' : ''))
      : '沒有符合的策略';

    var parts = [];
    if (pickedCount()) {
      parts.push(K.strategyTypes.filter(function (t) { return picked[t.id]; })
        .map(function (t) { return t.name; }).join('、'));
    } else {
      parts.push('全部類型');
    }
    if (query.trim()) parts.push('名稱含「' + query.trim() + '」');
    document.getElementById('filter-count').textContent =
      parts.join('・') + '　' + rows.length + ' / ' + ALL.length + ' 套';

    /* 選中那套被篩走的話,改為選第一行 */
    if (rows.length && !rows.some(function (s) { return s.id === selectedId; })) {
      select(rows[0].id);
    } else if (!rows.length) {
      selectedId = null;
      renderDetail(null);
    }
  }

  function select(id) {
    selectedId = id;
    document.querySelectorAll('#grp-body tr[data-id]').forEach(function (tr) {
      var on = tr.getAttribute('data-id') === id;
      tr.classList.toggle('is-picked', on);
      tr.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    renderDetail(id);
  }

  /* 表頭排序:跨全表 */
  function paintHeads() {
    document.querySelectorAll('#grp-table th.sortable').forEach(function (th) {
      var k = th.getAttribute('data-key');
      th.setAttribute('aria-sort', k === sortKey ? (sortDir === 'asc' ? 'ascending' : 'descending') : 'none');
    });
  }
  document.querySelectorAll('#grp-table th.sortable').forEach(function (th) {
    th.setAttribute('tabindex', '0');
    th.setAttribute('role', 'button');
    function go() {
      var k = th.getAttribute('data-key');
      if (k === sortKey) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      else { sortKey = k; sortDir = (k === 'name' || k === 'type') ? 'asc' : 'desc'; }
      paintHeads();
      renderTable();
    }
    th.addEventListener('click', go);
    th.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); }
    });
  });

  mountChips();
  paintChips();
  paintHeads();
  renderTable();            /* 內部會預設選中第一行 */
})();
</script>
</body>
</html>
