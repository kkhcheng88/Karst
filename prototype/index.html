<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>策略總覽 — Karst 原型</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="fit">

<div id="nav-host"></div>

<main class="wrap">

  <header class="page-head">
    <div class="page-head-row">
      <div>
        <div class="page-title-group">
          <h1>策略總覽</h1>
          <span class="proto-badge">原型・假數據</span>
        </div>
        <p class="page-sub">左邊是全部策略,按性質分組。點任何一行,右邊即出該策略的詳情卡。策略由幾套加到幾百套,這個看法都不用改。</p>
      </div>
    </div>
  </header>

  <div class="master-detail fit-main">

    <!-- ============ 左欄:全量策略列表 ============ -->
    <section class="md-list" aria-labelledby="h-all">
      <div class="section-head">
        <h2 id="h-all">全部策略</h2>
        <span class="section-note" id="all-note"></span>
      </div>
      <div class="table-scroll">
        <table class="kt" id="grp-table" style="min-width:760px">
          <thead>
            <tr>
              <th class="sortable" data-key="name" style="width:180px">名稱</th>
              <th class="sortable num" data-key="vsBench" style="width:118px">對基準</th>
              <th class="sortable num" data-key="cagr" style="width:72px">年化</th>
              <th class="sortable num" data-key="maxDD" style="width:86px">最大回撤</th>
              <th class="sortable num" data-key="winRate" style="width:112px">勝率 ／ 盈虧比</th>
              <th style="width:92px">迷你走勢</th>
              <th style="width:44px"><span class="dim" title="開啟策略頁">開啟</span></th>
            </tr>
          </thead>
          <tbody id="grp-body"></tbody>
        </table>
      </div>
      <div class="table-foot">
        <span id="all-foot"></span>
        <span>實線本策略、虛線 QQQ,同基期 100</span>
      </div>
    </section>

    <!-- ============ 右欄:選中策略詳情卡 ============ -->
    <aside class="md-detail" id="detail" aria-live="polite" aria-label="策略詳情"></aside>

  </div>

  <div id="foot-host"></div>
</main>

<script src="vendor/lightweight-charts.standalone.production.js"></script>
<script src="assets/data.js" charset="utf-8"></script>
<script src="assets/data-ext.js" charset="utf-8"></script>
<script src="assets/app.js" charset="utf-8"></script>
<script>
(function () {
  var K = window.KARST;
  KV.mountNav('index.html');
  KV.mountFoot();

  var qqq = K.benchmarks.QQQ, spy = K.benchmarks.SPY;

  var ALL = K.allStrategies;
  var byId = {};
  ALL.forEach(function (s) { byId[s.id] = s; });

  document.getElementById('all-note').textContent =
    K.meta.periodFrom + ' 至 ' + K.meta.periodTo + '(' + K.meta.years + ' 年)・對比 QQQ・排序在每組之內生效';
  document.getElementById('all-foot').textContent =
    '共 ' + ALL.length + ' 套,分 ' + K.groups.length + ' 組・截至 ' + K.meta.asOf;

  function vsBench(s) { return Math.round((s.metrics.cumReturn - qqq.metrics.cumReturn) * 10) / 10; }

  /* 原型只做了趨勢波段一頁,其餘策略的入口一律指去同一頁示意 */
  var STRATEGY_HREF = 'strategy.html';

  /* ============================================================
     右欄詳情卡
     ============================================================ */
  var selectedId = null;

  function renderDetail(id) {
    var host = document.getElementById('detail');
    var s = byId[id];
    if (!s) {
      host.innerHTML = '<div class="detail-empty">在左邊點一行,這裡出該策略的詳情。</div>';
      return;
    }

    var m = s.metrics;
    var vb = vsBench(s);
    var vc = Math.round((m.cagr - qqq.metrics.cagr) * 10) / 10;
    var ddBetter = m.maxDD > qqq.metrics.maxDD;   /* 回撤是負數,數值大即是回撤淺 */
    var grp = K.groups.filter(function (g) { return g.id === s.group; })[0];

    host.innerHTML =
      '<div class="detail-head">' +
        '<span class="detail-name">' + KV.esc(s.name) + '</span>' +
        '<span class="detail-en">' + KV.esc(s.en) + '</span>' +
        '<span class="tag ' + (s.kind === '策略' ? 'tag-strategy' : 'tag-follow') + '">' + s.kind + '</span>' +
        (s.id === 'trend-swing' ? '<span class="tag tag-live">紙上交易運行中</span>' : '') +
      '</div>' +
      '<div class="detail-sub">' + KV.esc(s.tagline) +
        '<br><span class="dim">分組:' + KV.esc(grp ? grp.name : '—') + '</span></div>' +

      '<div class="detail-block">' +
        '<div class="detail-block-title">現役設定</div>' +
        '<div class="config-chips">' +
          '<span class="chip"><span class="chip-k">版本</span><span class="chip-v">' + KV.esc(s.ver) + '</span></span>' +
        '</div>' +
        '<div class="detail-sub" style="margin:var(--s-2) 0 0;font-family:var(--font-mono);font-size:var(--fs-sm)">' +
          KV.esc(s.paramSummary) + '</div>' +
      '</div>' +

      '<div class="detail-block">' +
        '<div class="detail-block-title">四項指標</div>' +
        '<div class="metric-grid" style="margin-bottom:0">' +
          '<div>' +
            '<div class="metric-label">累計回報 對基準</div>' +
            '<div class="metric-value ' + KV.cls(vb) + '">' + KV.pp(vb) + '</div>' +
            '<div class="metric-vs">本策略 ' + KV.pct(m.cumReturn) + '・QQQ ' + KV.pct(qqq.metrics.cumReturn) + '</div>' +
          '</div>' +
          '<div>' +
            '<div class="metric-label">年化回報</div>' +
            '<div class="metric-value ' + KV.cls(m.cagr) + '">' + KV.pctPlain(m.cagr) + '</div>' +
            '<div class="metric-vs">對 QQQ ' + KV.pp(vc) + '</div>' +
          '</div>' +
          '<div>' +
            '<div class="metric-label">最大回撤</div>' +
            '<div class="metric-value down">' + KV.pctPlain(m.maxDD) + '</div>' +
            '<div class="metric-vs">QQQ ' + KV.pctPlain(qqq.metrics.maxDD) + '・' +
              (ddBetter ? '較淺' : '較深') + '</div>' +
          '</div>' +
          '<div>' +
            '<div class="metric-label">勝率 ／ 盈虧比</div>' +
            '<div class="metric-value">' + m.winRate + '%<span class="dim" style="font-weight:400"> ／ </span>' +
              m.plRatio.toFixed(1) + '</div>' +
            '<div class="metric-vs">共 ' + m.trades + ' 筆交易</div>' +
          '</div>' +
        '</div>' +
      '</div>' +

      '<div class="detail-block">' +
        '<div class="detail-block-title">淨值走勢</div>' +
        '<div class="spark-wrap" style="height:84px" id="detail-spark"></div>' +
        '<div class="bench-line" style="margin-top:var(--s-2)">' +
          '<span><i style="background:' + (m.cumReturn >= 0 ? 'var(--up)' : 'var(--down)') + '"></i>' +
            KV.esc(s.name) + ' <b class="' + KV.cls(m.cumReturn) + '">' + KV.pct(m.cumReturn) +
            '</b>・年化 <b>' + KV.pctPlain(m.cagr) + '</b></span>' +
          '<span><i style="background:var(--bench-spy)"></i>QQQ <b>' + KV.pct(qqq.metrics.cumReturn) +
            '</b>・年化 <b>' + KV.pctPlain(qqq.metrics.cagr) + '</b></span>' +
          '<span title="圖上只畫了本策略與 QQQ 兩條線"><i style="background:var(--bg-4)"></i>' +
            'SPY <b>' + KV.pct(spy.metrics.cumReturn) + '</b>・年化 <b>' +
            KV.pctPlain(spy.metrics.cagr) + '</b></span>' +
        '</div>' +
      '</div>' +

      '<div class="detail-block">' +
        '<div class="detail-block-title">最近一次運行</div>' +
        '<div class="mono">' + KV.esc(s.lastRun) + '</div>' +
      '</div>' +

      '<a class="btn btn-primary detail-cta" href="' + STRATEGY_HREF + '">開啟策略頁 →</a>' +
      (s.id === 'trend-swing' ? '' :
        '<p class="section-note" style="margin:var(--s-2) 0 0;text-align:center">' +
          '原型只做了趨勢波段一頁,其餘策略暫時都指去同一頁示意</p>');

    KV.sparkline(document.getElementById('detail-spark'), s.equity, qqq.equity);
  }

  /* ============================================================
     左欄分組表
     ============================================================ */
  var sortKey = 'vsBench', sortDir = 'desc';
  var openState = {};
  K.groups.forEach(function (g) { openState[g.id] = true; });

  var GETTERS = {
    name: function (s) { return s.name; },
    vsBench: vsBench,
    cagr: function (s) { return s.metrics.cagr; },
    maxDD: function (s) { return s.metrics.maxDD; },
    winRate: function (s) { return s.metrics.winRate; },
  };

  function renderTable() {
    var sparkJobs = [];
    var html = '';
    var firstId = null;

    K.groups.forEach(function (g) {
      var rows = ALL.filter(function (s) { return s.group === g.id; });
      var get = GETTERS[sortKey];
      rows = rows.slice().sort(function (a, b) {
        var x = get(a), y = get(b);
        if (typeof x === 'string') return sortDir === 'asc' ? x.localeCompare(y) : y.localeCompare(x);
        return sortDir === 'asc' ? x - y : y - x;
      });

      var open = openState[g.id];
      html +=
        '<tr class="grp-row">' +
          '<td colspan="7">' +
            '<button class="grp-head" data-group="' + g.id + '" aria-expanded="' + (open ? 'true' : 'false') + '">' +
              '<span class="grp-caret">▼</span>' +
              '<span class="grp-name">' + KV.esc(g.name) + '</span>' +
              '<span class="grp-count">' + rows.length + ' 套</span>' +
              '<span class="grp-note">' + KV.esc(g.note) + '</span>' +
            '</button>' +
          '</td>' +
        '</tr>';

      rows.forEach(function (s) {
        if (!firstId && open) firstId = s.id;
        var m = s.metrics;
        var vb = vsBench(s);
        var sparkId = 'sp-' + s.id;
        sparkJobs.push([sparkId, s]);

        html +=
          '<tr data-g="' + g.id + '" data-id="' + KV.esc(s.id) + '" tabindex="0" role="button" ' +
            'class="row-clickable' + (s.id === selectedId ? ' is-picked' : '') + '" ' +
            'aria-pressed="' + (s.id === selectedId ? 'true' : 'false') + '"' + (open ? '' : ' hidden') + '>' +
            '<td title="' + KV.esc(s.name) + '">' + KV.esc(s.name) +
              (s.demo ? '<span class="demo-mark">示意</span>' : '') + '</td>' +
            '<td class="num ' + KV.cls(vb) + '">' + KV.pp(vb) + '</td>' +
            '<td class="num ' + KV.cls(m.cagr) + '">' + KV.pctPlain(m.cagr) + '</td>' +
            '<td class="num down">' + KV.pctPlain(m.maxDD) + '</td>' +
            '<td class="num">' + m.winRate + '%<span class="dim"> ／ </span>' + m.plRatio.toFixed(1) + '</td>' +
            '<td><span class="row-spark" id="' + sparkId + '"></span></td>' +
            '<td><a class="row-go" href="' + STRATEGY_HREF + '" data-go="1" ' +
              'aria-label="開啟 ' + KV.esc(s.name) + ' 策略頁" title="開啟策略頁">→</a></td>' +
          '</tr>';
      });
    });

    document.getElementById('grp-body').innerHTML = html;

    sparkJobs.forEach(function (j) {
      var el = document.getElementById(j[0]);
      if (el) KV.sparkline(el, j[1].equity, qqq.equity);
    });

    /* 摺疊 */
    document.querySelectorAll('.grp-head').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-group');
        openState[id] = !openState[id];
        b.setAttribute('aria-expanded', openState[id] ? 'true' : 'false');
        document.querySelectorAll('tr[data-g="' + id + '"]').forEach(function (tr) {
          tr.hidden = !openState[id];
        });
      });
    });

    /* 點行選中。箭嘴是快捷入口,點它直接開頁,不當作選中 */
    document.querySelectorAll('#grp-body tr[data-id]').forEach(function (tr) {
      function go() { select(tr.getAttribute('data-id')); }
      tr.addEventListener('click', function (e) {
        if (e.target.closest('[data-go]')) return;
        go();
      });
      tr.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); }
      });
    });

    return firstId;
  }

  function select(id) {
    selectedId = id;
    document.querySelectorAll('#grp-body tr[data-id]').forEach(function (tr) {
      var on = tr.getAttribute('data-id') === id;
      tr.classList.toggle('is-picked', on);
      tr.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    renderDetail(id);
  }

  /* 表頭排序 */
  function paintHeads() {
    document.querySelectorAll('#grp-table th.sortable').forEach(function (th) {
      var k = th.getAttribute('data-key');
      th.setAttribute('aria-sort', k === sortKey ? (sortDir === 'asc' ? 'ascending' : 'descending') : 'none');
    });
  }
  document.querySelectorAll('#grp-table th.sortable').forEach(function (th) {
    th.setAttribute('tabindex', '0');
    th.setAttribute('role', 'button');
    function go() {
      var k = th.getAttribute('data-key');
      if (k === sortKey) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      else { sortKey = k; sortDir = k === 'name' ? 'asc' : 'desc'; }
      paintHeads();
      renderTable();
    }
    th.addEventListener('click', go);
    th.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); }
    });
  });

  paintHeads();
  var first = renderTable();
  select(first);            /* 預設選中第一行 */
})();
</script>
</body>
</html>
