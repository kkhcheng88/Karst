<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>參數掃描 — Karst 原型</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="fit">

<div id="nav-host"></div>

<main class="wrap">

  <header class="page-head">
    <div class="page-head-row">
      <div>
        <div class="page-title-group">
          <nav class="breadcrumb" aria-label="麵包屑" style="margin:0">
            <a href="index.html">策略總覽</a><span>／</span>
            <a href="strategy.html">趨勢波段</a><span>／</span>
          </nav>
          <h1>參數掃描</h1>
          <span class="proto-badge">原型・假數據</span>
        </div>
      </div>
    </div>
  </header>

  <!-- ============ 全頁只有這一條薄頂列:揀軸 + 定住餘下兩個參數 ============ -->
  <div class="sweep-bar" id="sweep-bar">
    <div class="axis-pick">
      <label for="ax-y">縱軸</label>
      <select class="axis-sel" id="ax-y"></select>
    </div>
    <div class="axis-pick">
      <label for="ax-x">橫軸</label>
      <select class="axis-sel" id="ax-x"></select>
    </div>
    <span class="bar-sep" aria-hidden="true"></span>
    <div id="slices" style="display:flex;align-items:center;gap:var(--s-4);flex:none"></div>
    <span class="bar-sep" aria-hidden="true"></span>
    <span class="section-note" id="slice-note" style="min-width:0;overflow:hidden;text-overflow:ellipsis"></span>
  </div>

  <dialog class="modal" id="rescan-modal" aria-labelledby="rescan-title">
    <div class="modal-body">
      <div class="modal-title" id="rescan-title">以現版本重掃</div>
      <div id="rescan-body"></div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="rescan-close">知道了</button>
    </div>
  </dialog>

  <div class="fit-main" style="grid-template-columns:minmax(0,1fr) 360px">

    <!-- ============ 熱力圖做畫面主體 ============ -->
    <div class="fit-panel">
      <div class="tabs" role="tablist" aria-label="掃描檢視">
        <button class="tab-btn" role="tab" id="tab-heat" aria-selected="true" aria-controls="p-heat">年化回報熱力圖</button>
        <button class="tab-btn" role="tab" id="tab-small" aria-selected="false" aria-controls="p-small">小倍數・六對參數</button>
        <div class="heat-legend" style="margin-left:auto;align-self:center;padding-right:var(--s-4)">
          <span id="scale-min"></span>
          <span class="scale-bar" id="scale-bar"></span>
          <span id="scale-max"></span>
          <span class="hl-item" title="一整片鄰居一起好:參數偏離少許一樣賺錢,優勢來自策略本身,實盤可行">
            <span class="legend-chip plateau" aria-hidden="true"></span><b>穩健平原</b></span>
          <span class="hl-item" title="自己一格特別好、四周全部差:多數是擬合噪音,換一段時間就消失">
            <span class="legend-chip spike" aria-hidden="true"></span><b>孤峰</b></span>
        </div>
      </div>
      <div class="fit-panel-body" style="overflow:hidden">

        <div class="tab-panel" id="p-heat" role="tabpanel" aria-labelledby="tab-heat">
          <div class="heat-fill" style="padding:var(--s-3) var(--s-4)">
            <div class="heat-scroll">
              <div class="heat" id="heat"></div>
            </div>
          </div>
        </div>

        <div class="tab-panel" id="p-small" role="tabpanel" aria-labelledby="tab-small" hidden
             style="overflow:auto;height:100%">
          <div style="padding:var(--s-4)">
            <p class="section-note" style="margin:0 0 var(--s-3)">
              掃描有四個參數,一張圖只看得到兩個。四個兩兩配對共六張,一次過掃完,哪一對站得住一眼看得出。
              每張各自用自己的色階,只看形狀:亮的一整片 = 平原,亮的一點 = 孤峰。
            </p>
            <div class="small-grid" id="small"></div>
          </div>
        </div>

      </div>
    </div>

    <!-- ============ 右欄:裁決 + 選中格詳情 ============ -->
    <aside class="fit-panel" aria-label="參數組詳情">
      <div class="verdict-slim" id="verdict"></div>
      <div class="fit-panel-head">
        <h2 style="font-size:var(--fs-md)">參數組詳情</h2>
        <span class="tag" id="cell-tag"></span>
      </div>
      <div class="fit-panel-body" style="padding:var(--s-4)">
        <div id="cell-detail"></div>

        <div style="margin-top:var(--s-4);padding-top:var(--s-3);border-top:1px solid var(--line)">
          <h3 style="font-size:var(--fs-base);margin-bottom:var(--s-2)">鄰域穩健度</h3>
          <p class="section-note" style="margin:0 0 var(--s-3)">看四周八格。鄰居一起好 = 平原;自己好、鄰居差 = 孤峰。</p>
          <div id="nbhd"></div>
        </div>
      </div>
    </aside>

  </div>

  <div id="foot-host"></div>
</main>

<script src="vendor/lightweight-charts.standalone.production.js"></script>
<script src="assets/data.js" charset="utf-8"></script>
<script src="assets/data-ext.js" charset="utf-8"></script>
<script src="assets/app.js" charset="utf-8"></script>
<script>
(function () {
  var K = window.KARST;
  KV.mountNav('sweep.html');
  KV.mountFoot();

  var PARAMS = K.sweepParams;
  var byId = K.sweepParamById;

  /* 預設就是第一版那一幅:縱軸突破日數、橫軸止蝕,另外兩個定住 */
  var yId = 'n', xId = 'stop';
  var fixed = { n: 30, stop: 8, risk: 1.0, ma: 150 };

  var heat = document.getElementById('heat');
  var S = null, MIN = 0, MAX = 1;

  KV.initTabs('.tabs');

  /* ============================================================
     運行身份:版本與快照只在導航列的晶片講一次
     ============================================================ */
  var SWEEP_SNAP = 'DS-2026-06-30-a';
  var bind = K.sweep.binding;
  var stale = K.staleCheck(bind);
  var staleNames = {};
  stale.items.forEach(function (it) { staleNames[it.name] = it; });

  var factorCell = bind.factors.map(function (f) {
    var reg = K.factorRegistry.filter(function (x) { return x.id === f.id; })[0];
    var nm = reg ? reg.name : f.id;
    var bad = !!staleNames[nm];
    return '<span class="' + (bad ? 'ver-stale' : '') + '">' +
      KV.esc(nm) + ' ' + KV.esc(f.ver) + (bad ? ' ▲' : '') + '</span>';
  }).join('<span class="dim">・</span>');

  var modal = document.getElementById('rescan-modal');

  KV.runChip({
    ver: bind.strategyVer,
    snapshot: SWEEP_SNAP,
    stale: stale,
    rows: [
      { k: '策略版本', v: KV.esc(bind.strategyVer) },
      { k: '因子版本', v: factorCell },
      { k: '掃描範圍', v: '四個參數,任揀兩個做軸' },
      { k: '數據快照', v: KV.esc(SWEEP_SNAP) },
    ],
    warnText: stale.stale
      ? '整幅熱力圖是舊版本之下的紀錄,不會自動更新——照這幅圖揀參數,揀到的是舊計法下的平原。'
      : '',
    actionLabel: '以現版本重掃',
    onAction: function () { if (modal.showModal) modal.showModal(); },
  });

  if (stale.stale) {
    var lines = stale.items.map(function (it) {
      return it.kind + ' ' + it.name + ' 由 ' + it.was + ' 更新到 ' + it.now + '(' + it.updatedAt + ')';
    });
    document.getElementById('rescan-body').innerHTML =
      '<p><b>本次掃描綁定的版本已經落後:' + KV.esc(lines.join(';')) + '。</b></p>' +
      '<p>會用現行版本重掃一次,產生一幅<b>新的掃描</b>,與本次掃描血統相連:同一個參數範圍、' +
        '同一個數據快照,分別只在版本。兩幅圖可以並排比較,本次掃描不會被改寫。</p>' +
      '<div class="lineage">' +
        '本次掃描　<b>SWEEP-2026-0731-01</b>　' + KV.esc(bind.strategyVer) + '・' +
          KV.esc(K.factorLine(bind)) + '<br>' +
        '　　└─ 新掃描　<b>SWEEP-2026-0826-NEW</b>　' + KV.esc(K.strategyCurrentVer) + '・' +
          KV.esc(K.factorRegistry.map(function (f) { return f.name + ' ' + f.current; }).join('・')) +
      '</div>' +
      '<p class="dim">原型不會真的重掃 —— 這一格只為示意「舊掃描不改寫,新掃描接上血統」。</p>';
    document.getElementById('rescan-close').addEventListener('click', function () { modal.close(); });
  }

  /* ============================================================
     揀軸:四個參數任揀兩個,揀到同一個就對調
     ============================================================ */
  function fillSelect(sel, picked) {
    sel.innerHTML = PARAMS.map(function (p) {
      return '<option value="' + p.id + '"' + (p.id === picked ? ' selected' : '') + '>' +
        KV.esc(p.label) + '</option>';
    }).join('');
  }
  var selY = document.getElementById('ax-y'), selX = document.getElementById('ax-x');
  fillSelect(selY, yId);
  fillSelect(selX, xId);

  selY.addEventListener('change', function () {
    var v = selY.value;
    if (v === xId) { xId = yId; fillSelect(selX, xId); }   /* 兩軸不可相同,對調 */
    yId = v;
    mountSlices();
    renderAll();
  });
  selX.addEventListener('change', function () {
    var v = selX.value;
    if (v === yId) { yId = xId; fillSelect(selY, yId); }
    xId = v;
    mountSlices();
    renderAll();
  });

  /* ---------- 餘下兩個參數自動變成切片選擇器 ---------- */
  function sliceIds() {
    return PARAMS.filter(function (p) { return p.id !== xId && p.id !== yId; })
      .map(function (p) { return p.id; });
  }

  function mountSlices() {
    var host = document.getElementById('slices');
    host.innerHTML = sliceIds().map(function (id) {
      var p = byId[id];
      return '<div class="slice-group">' +
        '<span class="slice-label">' + KV.esc(p.label) +
          '<span class="hint" title="' + KV.esc(p.hint) + '">?</span></span>' +
        '<div class="date-switch" role="group" aria-label="' + KV.esc(p.label) + '">' +
          p.values.map(function (v) {
            return '<button type="button" data-p="' + id + '" data-v="' + v + '" aria-pressed="' +
              (v === fixed[id] ? 'true' : 'false') + '">' + KV.esc(p.fmt(v)) + '</button>';
          }).join('') +
        '</div>' +
      '</div>';
    }).join('');
  }

  document.getElementById('slices').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-v]');
    if (!b) return;
    var pid = b.getAttribute('data-p');
    fixed[pid] = parseFloat(b.getAttribute('data-v'));
    b.parentElement.querySelectorAll('button').forEach(function (o) {
      o.setAttribute('aria-pressed', o === b ? 'true' : 'false');
    });
    renderAll();
  });

  /* ---------- 鄰域統計 ---------- */
  function neighbours(ri, ci) {
    var out = [], R = S.grid.length, C = S.grid[0].length;
    for (var dr = -1; dr <= 1; dr++) {
      for (var dc = -1; dc <= 1; dc++) {
        if (!dr && !dc) continue;
        var a = ri + dr, b = ci + dc;
        if (a < 0 || b < 0 || a >= R || b >= C) continue;
        out.push(S.grid[a][b]);
      }
    }
    return out;
  }
  function nbhdStats(ri, ci) {
    var ns = neighbours(ri, ci).map(function (c) { return c.cagr; });
    var mean = ns.reduce(function (a, b) { return a + b; }, 0) / ns.length;
    var sd = Math.sqrt(ns.reduce(function (a, b) { return a + (b - mean) * (b - mean); }, 0) / ns.length);
    return { mean: mean, sd: sd, min: Math.min.apply(null, ns), max: Math.max.apply(null, ns),
             gap: S.grid[ri][ci].cagr - mean, n: ns.length };
  }

  function norm(v) { return (v - MIN) / ((MAX - MIN) || 1); }

  /* ---------- 整頁重畫 ---------- */
  function renderAll() {
    var yp = byId[yId], xp = byId[xId];
    S = K.sweepGrid(yId, xId, fixed);

    var flat = [];
    S.grid.forEach(function (row) { row.forEach(function (c) { flat.push(c.cagr); }); });
    MIN = Math.min.apply(null, flat);
    MAX = Math.max.apply(null, flat);

    var sliceTxt = sliceIds().map(function (id) {
      return byId[id].label + ' ' + byId[id].fmt(fixed[id]);
    }).join('、');
    document.getElementById('slice-note').innerHTML = S.isBase
      ? '目前是預設那一幅(' + sliceTxt + ')。換軸或換切片,好的那一區會搬位 —— 這正是四維掃描要看的事。'
      : '<b style="color:var(--warn)">已換</b>:' + yp.label + ' × ' + xp.label +
        ',' + sliceTxt + '。整幅圖是這個切面的數字,平原與孤峰重新判過。';

    /* ---- 裁決 ---- */
    var best = null, bestPos = null;
    S.grid.forEach(function (row, ri) {
      row.forEach(function (c, ci) { if (!best || c.cagr > best.cagr) { best = c; bestPos = [ri, ci]; } });
    });
    var pc = S.plateauCenter;
    var pCell = S.grid[pc[0]][pc[1]];
    var bestN = nbhdStats(bestPos[0], bestPos[1]);
    var plateauN = nbhdStats(pc[0], pc[1]);
    var bestInPlateau = !!S.plateauSet[bestPos[0] + ',' + bestPos[1]];

    var spikeCell = null, spikeN = null;
    if (S.spikePos) {
      spikeCell = S.grid[S.spikePos[0]][S.spikePos[1]];
      spikeN = nbhdStats(S.spikePos[0], S.spikePos[1]);
    }

    function where(cell) {
      return yp.label + ' ' + yp.fmt(cell.vals[yId]) + '、' + xp.label + ' ' + xp.fmt(cell.vals[xId]);
    }

    /* 換了軸或切片之後,最高分那格未必真的是孤峰 —— 有幾多講幾多,不要照套同一句 */
    var head = (!bestInPlateau && bestN.gap >= 4)
      ? '全格最高分那格,不是最應該選那格。'
      : '這一幅的最高分,剛好就落在平原之內。';

    var html = '<b>' + head + '</b><br>' +
      '最高分 <b>' + KV.esc(where(best)) + '</b>,年化 <b class="up">' + KV.pctPlain(best.cagr) +
        '</b>,八個鄰居平均 <b class="' + KV.cls(bestN.mean - 12) + '">' +
        KV.pctPlain(bestN.mean) + '</b>(相差 ' + KV.pp(bestN.gap) + ')。<br>';

    if (spikeCell && spikeN.gap >= 3 && (S.spikePos[0] !== bestPos[0] || S.spikePos[1] !== bestPos[1])) {
      html += '孤峰在 <b>' + KV.esc(where(spikeCell)) + '</b>:年化 ' + KV.pctPlain(spikeCell.cagr) +
        ',高出鄰域 ' + KV.pp(spikeN.gap) + ',換一段時間多數消失。<br>';
    }

    html += '平原中心 <b>' + KV.esc(where(pCell)) + '</b> 年化 <b class="up">' + KV.pctPlain(pCell.cagr) +
      '</b>,鄰居平均有 <b class="up">' + KV.pctPlain(plateauN.mean) + '</b>,整片一起好。' +
      '<b>實盤要選平原,不是孤峰。</b>';

    document.getElementById('verdict').innerHTML = html;

    /* ---- 熱力圖:撐滿面板 ---- */
    var R = S.grid.length, C = S.grid[0].length;
    heat.style.gridTemplateColumns = '64px repeat(' + C + ', minmax(48px, 1fr))';
    heat.style.gridTemplateRows = '20px repeat(' + R + ', minmax(24px, 1fr))';

    var html = '<div class="heat-corner" style="display:flex;align-items:center;justify-content:center">' +
      KV.esc(yp.short) + ' ＼ ' + KV.esc(xp.short) + '</div>';
    S.colVals.forEach(function (v) {
      html += '<div class="heat-axis-label">' + KV.esc(xp.fmt(v)) + '</div>';
    });

    S.grid.forEach(function (row, ri) {
      html += '<div class="heat-axis-label row-label">' + KV.esc(yp.fmt(S.rowVals[ri])) + '</div>';
      row.forEach(function (cell, ci) {
        var t = norm(cell.cagr);
        var klass = 'heat-cell';
        if (cell.spike) klass += ' is-spike';
        else if (S.plateauSet[ri + ',' + ci]) klass += ' in-plateau';
        html += '<button class="' + klass + '" data-r="' + ri + '" data-c="' + ci + '" ' +
          'aria-pressed="false" ' +
          'aria-label="' + KV.esc(where(cell)) + ',年化回報 ' + cell.cagr + '%' +
            (cell.spike ? ',孤峰' : (S.plateauSet[ri + ',' + ci] ? ',穩健平原' : '')) + '" ' +
          'style="background:' + KV.heatColor(t) + ';color:' + KV.heatTextColor(t) + '">' +
          cell.cagr.toFixed(1) + '</button>';
      });
    });
    heat.innerHTML = html;

    var bar = '';
    for (var i = 0; i < 40; i++) bar += '<i style="background:' + KV.heatColor(i / 39) + '"></i>';
    document.getElementById('scale-bar').innerHTML = bar;
    document.getElementById('scale-min').textContent = MIN.toFixed(1) + '%';
    document.getElementById('scale-max').textContent = MAX.toFixed(1) + '%';

    select(pc[0], pc[1]);
  }

  /* ---------- 選中格 ---------- */
  function select(ri, ci) {
    heat.querySelectorAll('.heat-cell').forEach(function (b) {
      b.setAttribute('aria-pressed',
        (+b.dataset.r === ri && +b.dataset.c === ci) ? 'true' : 'false');
    });

    var cell = S.grid[ri][ci];
    var st = nbhdStats(ri, ci);
    var isPlateau = !!S.plateauSet[ri + ',' + ci];

    var tag = document.getElementById('cell-tag');
    tag.textContent = cell.spike ? '孤峰' : (isPlateau ? '穩健平原' : '一般');
    tag.className = 'tag ' + (cell.spike ? 'tag-current' : (isPlateau ? 'tag-live' : ''));

    document.getElementById('cell-detail').innerHTML =
      '<div style="font-family:var(--font-mono);font-size:var(--fs-sm);color:var(--text-2);' +
        'margin-bottom:var(--s-3);line-height:1.8">' +
        PARAMS.map(function (p) {
          var onAxis = (p.id === xId || p.id === yId);
          return '<span' + (onAxis ? ' style="color:var(--text-1);font-weight:700"' : '') + '>' +
            KV.esc(p.short) + ' ' + KV.esc(p.fmt(cell.vals[p.id])) + '</span>';
        }).join('<span class="dim">　</span>') +
      '</div>' +
      '<dl class="def-list">' +
        '<dt>年化回報</dt><dd class="' + KV.cls(cell.cagr) + '">' + KV.pctPlain(cell.cagr) + '</dd>' +
        '<dt>最大回撤</dt><dd class="down">' + KV.pctPlain(cell.mdd) + '</dd>' +
        '<dt>Sortino</dt><dd>' + cell.sortino.toFixed(2) + '</dd>' +
        '<dt>交易數</dt><dd>' + cell.trades + '</dd>' +
      '</dl>';

    var verdict, vcls;
    if (st.gap >= 5.5) { verdict = '孤峰嫌疑:自己高出鄰域 ' + KV.pctPlain(st.gap) + ',換一段時間好可能消失。'; vcls = 'down'; }
    else if (st.mean >= 15) { verdict = '穩健:鄰域平均都有 ' + KV.pctPlain(st.mean) + ',參數偏離一兩格照樣賺錢。'; vcls = 'up'; }
    else { verdict = '平平:鄰域平均只有 ' + KV.pctPlain(st.mean) + ',這一區整體不理想。'; vcls = 'dim'; }

    document.getElementById('nbhd').innerHTML =
      '<dl class="def-list">' +
        '<dt>本格</dt><dd>' + KV.pctPlain(cell.cagr) + '</dd>' +
        '<dt>鄰域平均</dt><dd>' + KV.pctPlain(st.mean) + '(' + st.n + ' 格)</dd>' +
        '<dt>鄰域範圍</dt><dd>' + KV.pctPlain(st.min) + ' — ' + KV.pctPlain(st.max) + '</dd>' +
        '<dt>鄰域離散</dt><dd>' + st.sd.toFixed(1) + '</dd>' +
        '<dt>本格 減 鄰域</dt><dd class="' + KV.cls(st.gap) + '">' + KV.pp(st.gap) + '</dd>' +
      '</dl>' +
      '<p class="section-note ' + vcls + '" style="margin:var(--s-3) 0 0;line-height:1.7">' + verdict + '</p>';
  }

  heat.addEventListener('click', function (e) {
    var b = e.target.closest('.heat-cell');
    if (b) select(+b.dataset.r, +b.dataset.c);
  });

  /* ---------- 小倍數(摺入第二個分頁,不擠主圖) ---------- */
  document.getElementById('small').innerHTML = K.sweepSmall.map(function (p) {
    var flat = [];
    p.grid.forEach(function (row) { row.forEach(function (v) { flat.push(v); }); });
    var lo = Math.min.apply(null, flat), hi = Math.max.apply(null, flat);
    var span = (hi - lo) || 1;

    var cells = '';
    p.grid.forEach(function (row, ri) {
      row.forEach(function (v, ci) {
        var t = (v - lo) / span;
        var isCur = (ri === p.cur[0] && ci === p.cur[1]);
        cells += '<div class="mini-cell' + (isCur ? ' is-cur' : '') + '" ' +
          'title="' + KV.esc(p.rowLabel) + ' ' + p.rows[ri] + '・' +
            KV.esc(p.colLabel) + ' ' + p.cols[ci] + ':年化 ' + v.toFixed(1) + '%"' +
          ' style="background:' + KV.heatColor(t) + '"></div>';
      });
    });

    return '<div class="small-card">' +
      '<div class="small-head">' +
        '<span class="small-title">' + KV.esc(p.rowLabel) + ' × ' + KV.esc(p.colLabel) + '</span>' +
        '<span class="tag ' + (p.verdict === '平原' ? 'tag-live' : 'tag-current') + '">' + p.verdict + '</span>' +
      '</div>' +
      '<div class="small-axis">縱 ' + p.rows[0] + '–' + p.rows[p.rows.length - 1] +
        '　橫 ' + p.cols[0] + '–' + p.cols[p.cols.length - 1] + '</div>' +
      '<div class="mini-heat" style="grid-template-columns:repeat(' + p.cols.length + ',1fr)">' +
        cells +
      '</div>' +
      '<div class="small-note">' + KV.esc(p.note) + '</div>' +
    '</div>';
  }).join('');

  mountSlices();
  renderAll();
})();
</script>
</body>
</html>
