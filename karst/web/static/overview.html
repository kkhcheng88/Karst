<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>策略總覽 — Karst</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="fit">

<div id="nav-host"></div>

<main class="wrap">

  <header class="page-head">
    <div class="page-head-row">
      <div>
        <div class="page-title-group">
          <h1>策略總覽</h1>
        </div>
        <p class="page-sub">一張平表,可跨全表排序。上面按類型篩選、按名稱搜尋。策略由二十套加到幾百套,這個看法都不用改。</p>
      </div>
    </div>
  </header>

  <!-- ============ 篩選列:類型晶片(可多選)+ 名稱搜尋 ============ -->
  <div class="filter-bar" id="filter-bar">
    <div class="chip-row" id="type-chips" role="group" aria-label="按策略類型篩選"></div>
    <div class="chip-sep" aria-hidden="true"></div>
    <input class="search-box" id="q" type="search" placeholder="搜尋策略名稱" aria-label="按名稱搜尋策略" autocomplete="off">
    <span class="filter-count" id="filter-count"></span>
  </div>

  <div class="fit-main" id="fit-main" style="grid-template-columns:minmax(0,62fr) minmax(0,38fr)">

    <!-- ============ 左欄:全量策略平表 ============ -->
    <section class="fit-panel" aria-labelledby="h-all">
      <h2 id="h-all" class="sr-only">全部策略</h2>
      <div class="fit-panel-body" id="table-wrap">
        <table class="kt flat" id="grp-table">
          <thead>
            <tr>
              <th class="sortable" data-key="name" style="width:168px">名稱</th>
              <th class="sortable" data-key="type" style="width:104px">類型</th>
              <th class="sortable num" data-key="vsBench" style="width:104px">對基準</th>
              <th class="sortable num" data-key="cagr" style="width:70px">年化</th>
              <th class="sortable num" data-key="maxDD" style="width:84px">最大回撤</th>
              <th class="sortable num" data-key="winRate" style="width:110px">勝率 ／ 盈虧比</th>
              <th style="width:92px">迷你走勢</th>
              <th style="width:40px"><span class="dim" title="開啟策略頁">開啟</span></th>
            </tr>
          </thead>
          <tbody id="grp-body"></tbody>
        </table>
      </div>
      <div class="table-foot">
        <span id="page-foot"></span>
        <span id="spark-legend"></span>
      </div>
    </section>

    <!-- ============ 右欄:緊湊詳情卡 + 最近運行 ============ -->
    <div class="fit-col">
      <aside class="dcard" id="detail" aria-live="polite" aria-label="策略詳情"></aside>
      <div class="lastrun-line" id="lastrun"></div>
    </div>

  </div>

  <!-- ============ 空 / 錯誤狀態:整版換成一塊,不留半張空表 ============ -->
  <div class="fit-main" id="page-state" hidden style="grid-template-columns:minmax(0,1fr)">
    <section class="fit-panel">
      <div class="fit-panel-body" id="page-state-body"></div>
    </section>
  </div>

  <div id="foot-host"></div>
</main>

<script src="/static/app.js" charset="utf-8"></script>
<script src="/static/overview.js" charset="utf-8"></script>
</body>
</html>
