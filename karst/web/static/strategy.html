<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>策略詳情 — Karst</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="sp">

<div id="nav-host"></div>

<main class="wrap">

  <header class="page-head">
    <div class="page-title-group">
      <nav class="breadcrumb" aria-label="麵包屑"><a href="/">策略總覽</a><span>／</span></nav>
      <h1 id="strat-name">策略詳情</h1>
      <span class="page-en mono" id="strat-en"></span>
      <span class="tag tag-strategy" id="strat-kind" style="display:none"></span>
      <span class="tag tag-live" id="strat-live" style="display:none">現役設定</span>
    </div>
  </header>

  <!-- 全頁載入中／錯誤／空:三態共用這一格,有內容時整疊面板讓路 -->
  <div id="page-state"></div>

  <div class="sp-stack" id="sp-stack" hidden>

    <!-- ============================================================
         KARST-080(D-037):「檢視中」區塊(參數清單、運行編號、快照、視窗)
         整個拿走——用戶原話「Is not need to show in the strategy page」。
         這些資料只在運行詳情頁顯示(運行身份晶片,見 run-view.js)。策略頁頂
         只留策略名、版本與門面成績。
         ============================================================ -->

    <!-- ============ 頭條數字(按檢視視窗重算) ============ -->
    <div class="kpi-row" id="kpis"></div>

    <!-- ============ 左圖右名單:點圖上一日,右邊即時換 ============ -->
    <div class="sp-split">

      <section class="sp-panel sp-sticky" aria-labelledby="equity-title">
        <div class="sp-head">
          <div class="sp-side">
            <h2 id="equity-title">淨值走勢</h2>
            <div class="bench-line" id="equity-bench"></div>
          </div>
          <div class="winpick">
            <label for="win-date">檢視視窗</label>
            <div class="date-switch" id="win-pick" role="group" aria-label="檢視視窗起始"></div>
            <input class="sp-date" type="date" id="win-date" aria-label="自訂起始日">
          </div>
        </div>
        <div class="sp-sub" id="chart-sub"></div>
        <div class="sp-body">
          <div class="sp-chartwrap">
            <div class="sp-chart" id="equity-chart"></div>
            <div class="hovcard" id="hovcard" hidden aria-hidden="true"></div>
          </div>
        </div>
      </section>

      <section class="sp-panel" aria-labelledby="picks-title">
        <div class="sp-head">
          <div class="sp-side">
            <h2 id="picks-title">選股快照</h2>
            <span class="at-point" id="at-point"></span>
          </div>
          <div class="sp-side" id="picks-filter"></div>
        </div>
        <div class="sp-sub" id="picks-basis"></div>
        <div id="picks-table"></div>
      </section>

    </div>

    <!-- ============================================================
         熱力圖帶(D-036,KARST-079):該策略每個掃描一條帶,標最佳格與代表格。
         點一格直達參數掃描頁的單格曲線(?id=&sweep=&layer=&cell=)。
         沿用參數掃描頁(sweep.js)的熱力圖色階與最佳格/代表格籤,不重畫視覺。
         ============================================================ -->
    <section class="sp-panel" aria-labelledby="heatband-title">
      <div class="sp-head">
        <h2 id="heatband-title">參數掃描</h2>
        <span class="section-note" id="heatband-note"></span>
      </div>
      <div class="sp-body" id="heatband-body"></div>
    </section>

    <!-- ============================================================
         歷次運行(D-037):排名表,四個成績欄可點欄頭升降排序。
         快照、參數兩欄拿走(在運行詳情才看,見 index.html 運行身份晶片);
         點一行:換下面「持股分布」段。要看整次運行詳情(圖表/逐筆交易/
         因子)click 運行編號那個連結,直達運行詳情頁(D-035/D-036)。
         ============================================================ -->
    <section class="sp-panel" aria-labelledby="runs-title">
      <div class="sp-head">
        <h2 id="runs-title">歷次運行</h2>
        <span class="section-note">點一行:換下面「持股分布」・點運行編號:看該次詳情</span>
      </div>
      <div class="sp-body flush">
        <table class="kt">
          <thead>
            <tr>
              <th style="width:204px">運行編號</th>
              <th style="width:70px">版本</th>
              <th class="num sortable" data-sort="annualReturnPct" tabindex="0" role="button" style="width:96px">年化</th>
              <th class="num sortable" data-sort="sortinoRatio" tabindex="0" role="button" style="width:88px">Sortino</th>
              <th class="num sortable" data-sort="maxDrawdownPct" tabindex="0" role="button" style="width:100px">最大回撤</th>
              <th class="num sortable" data-sort="winRatePct" tabindex="0" role="button" style="width:104px">勝率</th>
            </tr>
          </thead>
          <tbody id="runs-body"></tbody>
        </table>
      </div>
    </section>

    <!-- ============================================================
         持股分布(D-037,原「因子分布」):與上面歷次運行表配對。頁面載入時
         顯示排名第一行那次運行的持股分布,點任一行即換成該次。因子敞口、
         因子版本已搬去運行詳情頁,這裡不再顯示。
         ============================================================ -->
    <section class="sp-panel" aria-labelledby="holdings-title">
      <div class="sp-head">
        <h2 id="holdings-title">持股分布</h2>
        <span class="section-note" id="holdings-note"></span>
      </div>
      <div class="sp-body flush" id="holdings-body"></div>
    </section>

    <!-- ============================================================
         選股漏斗(D-036/D-037 補充,KARST-080 搬到頁尾)。對應上面
         「選股快照」那一日,篩選作用於同一個 #picks-table。
         ============================================================ -->
    <section class="sp-panel" aria-labelledby="funnel-title">
      <div class="sp-head">
        <h2 id="funnel-title">選股漏斗</h2>
        <span class="section-note">逐層收窄・對應上面「選股快照」那一日</span>
      </div>
      <div class="sp-body">
        <div class="funnel-bar" id="funnel" role="group" aria-label="按層篩選名單"></div>
      </div>
    </section>

  </div>

</main>

<script src="/static/vendor/lightweight-charts.standalone.production.js"></script>
<script src="/static/app.js" charset="utf-8"></script>
<script src="/static/strategy.js" charset="utf-8"></script>
</body>
</html>
