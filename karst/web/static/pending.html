<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>未建成 — Karst</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div id="nav-host"></div>

<main class="wrap">
  <header class="page-head">
    <div class="page-head-row">
      <div>
        <div class="page-title-group">
          <h1 id="page-title">這一頁未建成</h1>
        </div>
      </div>
    </div>
  </header>

  <section class="fit-panel">
    <div class="state-block">
      <div class="state-title" id="state-title">這一頁未建成</div>
      <div id="state-text">這一頁正在建置中。導航列先掛住它的位置,好讓四頁的關係一開始就看得見。</div>
      <a class="btn btn-primary" href="/">回策略總覽</a>
    </div>
  </section>

</main>

<script src="/static/app.js" charset="utf-8"></script>
<script charset="utf-8">
(function () {
  /* 這一頁是哪一頁,由網址講;每頁建成之後由該頁自己接手這個網址。 */
  var NAMES = { '/strategy': '策略詳情', '/sweep': '參數掃描' };
  var path = location.pathname;
  var name = NAMES[path] || '這一頁';

  document.title = name + ' — Karst';
  document.getElementById('page-title').textContent = name;
  document.getElementById('state-title').textContent = name + '未建成';
  document.getElementById('state-text').textContent =
    name + '這一頁正在建置中。導航列先掛住它的位置,好讓四頁的關係一開始就看得見。';

  KV.mountNav(path, {});
})();
</script>
</body>
</html>
