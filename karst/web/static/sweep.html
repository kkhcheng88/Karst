<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>參數掃描 — Karst</title>
<link rel="stylesheet" href="/static/style.css">
<style>
/* 重掃彈窗那張表(KARST-052)。放這裡不放 style.css:只有本頁用得著,
   而且 style.css 現時由另外兩隊在改,少碰一個共用檔少一次撞。 */
.rr-grid {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--s-2) var(--s-4); margin: var(--s-4) 0;
}
.rr-cell { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.rr-cell > label { font-size: var(--fs-xs); color: var(--text-3); }
.rr-cell input {
  appearance: none; background: var(--bg-2); color: var(--text-1);
  border: 1px solid var(--line); border-radius: var(--r-1);
  padding: 4px var(--s-2); min-width: 0;
  font-family: var(--font-mono); font-size: var(--fs-xs);
}
.rr-cell input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
/* 改動過的那一格自己講出來:一眼見到新掃描與當前這幅差在哪 */
.rr-cell.is-changed > label { color: var(--accent); }
.rr-cell.is-changed input { border-color: var(--accent); }
.rr-cell-hint { font-size: var(--fs-xs); color: var(--text-3); }
.rr-facts { font-size: var(--fs-xs); color: var(--text-3); margin-top: var(--s-2); }
.rr-facts b { color: var(--text-2); font-weight: 400; font-family: var(--font-mono); }
</style>
</head>
<body class="fit">

<div id="nav-host"></div>

<main class="wrap">

  <header class="page-head">
    <div class="page-head-row">
      <div>
        <div class="page-title-group">
          <nav class="breadcrumb" aria-label="麵包屑" style="margin:0">
            <a href="/">策略總覽</a><span>／</span>
            <span id="bc-strategy"></span>
          </nav>
          <h1 id="page-title">參數掃描</h1>
        </div>
        <p class="page-sub" id="page-sub"></p>
      </div>
    </div>
  </header>

  <!-- 載入中 / 空 / 錯誤:三態共用這一格,出現時清單與工作區都收起 -->
  <div id="page-state" hidden></div>

  <!-- ============================================================
       視圖一:掃描清單。一次掃描一行,最佳格與代表格**並排**。
       一次掃描動輒幾千格,只報最佳格會把孤峰當成成績——所以這一版
       兩格永遠並列,裁決籤跟住每一格走。
       ============================================================ -->
  <div class="fit-main" id="list-view" style="grid-template-columns:minmax(0,1fr)" hidden>
    <section class="fit-panel" aria-labelledby="list-h">
      <div class="fit-panel-head">
        <h2 id="list-h" style="font-size:var(--fs-md)">掃描清單</h2>
        <span class="section-note" id="list-count"></span>
      </div>
      <div class="fit-panel-body" id="sweep-table"></div>
    </section>
  </div>

  <!-- ============================================================
       視圖二:一次掃描的四個元件(熱力圖、小倍數、切片、鄰域)
       ============================================================ -->
  <div id="detail-view" hidden>

    <div class="sp-runbar">
      <button class="btn" id="back-list">← 掃描清單</button>
      <span class="sp-runbar-k">檢視掃描</span>
      <div class="runpick" id="sweep-pick" role="group" aria-label="檢視哪一次掃描"></div>
      <button class="btn" id="rescan-open" style="margin-left:auto">以現版本重掃</button>
    </div>

    <!-- 薄頂列:揀軸 + 切層 + 定住餘下的連續軸 -->
    <div class="sweep-bar" id="sweep-bar">
      <div class="axis-pick">
        <label for="ax-y">縱軸</label>
        <select class="axis-sel" id="ax-y"></select>
      </div>
      <div class="axis-pick">
        <label for="ax-x">橫軸</label>
        <select class="axis-sel" id="ax-x"></select>
      </div>
      <span class="bar-sep" aria-hidden="true"></span>
      <div id="layers" style="display:flex;align-items:center;gap:var(--s-4);flex:none"></div>
      <div id="slices" style="display:flex;align-items:center;gap:var(--s-4);flex:none"></div>
      <span class="bar-sep" aria-hidden="true"></span>
      <span class="section-note" id="slice-note" style="min-width:0;overflow:hidden;text-overflow:ellipsis"></span>
    </div>

    <div id="detail-state" hidden></div>

    <div class="fit-main" id="fit-main" style="grid-template-columns:minmax(0,1fr) 360px">

      <!-- 熱力圖做畫面主體 -->
      <div class="fit-panel">
        <div class="tabs" role="tablist" aria-label="掃描檢視">
          <button class="tab-btn" role="tab" id="tab-heat" aria-selected="true" aria-controls="p-heat">熱力圖</button>
          <button class="tab-btn" role="tab" id="tab-small" aria-selected="false" aria-controls="p-small">小倍數</button>
          <div class="heat-legend" style="margin-left:auto;align-self:center;padding-right:var(--s-4)">
            <span id="scale-min"></span>
            <span class="scale-bar" id="scale-bar"></span>
            <span id="scale-max"></span>
            <span class="hl-item" title="一整片鄰居一起好:參數偏離少許一樣站得住,優勢來自策略本身,實盤可行">
              <span class="legend-chip plateau" aria-hidden="true"></span><b>穩健平原</b></span>
            <span class="hl-item" title="沿連續軸自己與鄰域都在高地,但同一組連續取值換去另一層即跌穿門檻:好成績靠揀對了那一層,不是靠參數本身">
              <span class="legend-chip ridge" aria-hidden="true"></span><b>山脊</b></span>
            <span class="hl-item" title="自己一格特別好、四周全部差:多數是擬合噪音,換一段時間就消失">
              <span class="legend-chip spike" aria-hidden="true"></span><b>孤峰</b></span>
            <span class="hl-item" title="成交筆數低於門檻,成績不作數">
              <span class="legend-chip invalid" aria-hidden="true"></span><b>無效格</b></span>
            <span class="hl-item" title="全掃描分數最高那格。單看它會被孤峰騙,所以永遠與代表格並列">
              <span class="legend-chip best" aria-hidden="true"></span><b>最佳格</b></span>
            <span class="hl-item" title="高地中間那格:鄰域平均最高而且不是孤峰。實盤要選的是它">
              <span class="legend-chip rep" aria-hidden="true"></span><b>代表格</b></span>
          </div>
        </div>
        <div class="fit-panel-body" style="overflow:hidden">

          <div class="tab-panel" id="p-heat" role="tabpanel" aria-labelledby="tab-heat">
            <div class="heat-fill" style="padding:var(--s-3) var(--s-4)">
              <div class="heat-scroll">
                <div class="heat" id="heat"></div>
              </div>
            </div>
          </div>

          <div class="tab-panel" id="p-small" role="tabpanel" aria-labelledby="tab-small" hidden
               style="overflow:auto;height:100%">
            <div style="padding:var(--s-4)">
              <p class="section-note" id="small-note" style="margin:0 0 var(--s-3)"></p>
              <div class="small-grid" id="small"></div>
            </div>
          </div>

        </div>
      </div>

      <!-- 右欄:裁決 + 選中格詳情 -->
      <aside class="fit-panel" aria-label="參數組詳情">
        <div class="verdict-slim" id="verdict"></div>
        <div class="fit-panel-head">
          <h2 style="font-size:var(--fs-md)">參數組詳情</h2>
          <span class="tag" id="cell-tag"></span>
        </div>
        <div class="fit-panel-body" style="padding:var(--s-4)">

          <!-- 未點格之前:整幅圖是地形,個別格的曲線要點過才開(D-029) -->
          <div class="state-block" id="cell-empty" style="padding:var(--s-6) var(--s-3)">
            <div class="state-title">點一格看那一次運行</div>
            <div>熱力圖看的是地形,不是個別結果。點任何一格,這裡開該格那一次運行的淨值曲線、成績與鄰域穩健度。<br>
              <b>最佳格</b>與<b>代表格</b>已在圖上標好。</div>
          </div>

          <div id="cell-body" hidden>
            <div id="curve-head" class="bench-line" style="margin-bottom:var(--s-2)"></div>
            <div class="chart-box" id="cell-chart" style="height:150px"></div>
            <div id="cell-detail" style="margin-top:var(--s-3)"></div>

            <div style="margin-top:var(--s-4);padding-top:var(--s-3);border-top:1px solid var(--line)">
              <h3 style="font-size:var(--fs-base);margin-bottom:var(--s-2)">鄰域穩健度</h3>
              <p class="section-note" style="margin:0 0 var(--s-3)">鄰域只沿連續軸取,並包含本格。鄰居一起好 = 平原;自己好、鄰居差 = 孤峰。</p>
              <div id="nbhd"></div>
            </div>
          </div>
        </div>
      </aside>

    </div>
  </div>

  <div id="foot-host"></div>
</main>

<!-- 以現版本重掃(KARST-052)。舊掃描一個字不改,新掃描另開一幅、血統相連。 -->
<dialog class="modal" id="rescan-modal" aria-labelledby="rescan-title">
  <div class="modal-body">
    <div class="modal-title" id="rescan-title">以現版本重掃</div>
    <div id="rescan-body"></div>
  </div>
  <div class="modal-foot">
    <button class="btn" id="rescan-cancel">取消</button>
    <button class="btn btn-primary" id="rescan-go">開始重掃</button>
  </div>
</dialog>

<script src="/static/vendor/lightweight-charts.standalone.production.js"></script>
<script src="/static/app.js" charset="utf-8"></script>
<script src="/static/sweep.js" charset="utf-8"></script>
</body>
</html>
