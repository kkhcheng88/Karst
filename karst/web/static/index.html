<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>運行詳情 — Karst</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="fit">

<div id="nav-host"></div>

<main class="wrap">

  <header class="page-head">
    <div class="page-head-row">
      <div>
        <div class="page-title-group">
          <h1>運行詳情</h1>
          <span class="page-en mono" id="bc-run"></span>
        </div>
        <p class="page-sub">左邊看圖、右邊看數。滑鼠停在曲線任何一日,即見當日的買賣;點下去右邊跳到那幾筆。點一筆交易,左邊換成該實體的蠟燭圖。</p>
      </div>
    </div>
  </header>

  <!-- ============ 檢視運行:揀哪一次,整頁跟著換 ============ -->
  <div class="sp-runbar">
    <span class="sp-runbar-k">檢視運行</span>
    <div class="runpick" id="run-pick" role="group" aria-label="檢視哪一次運行"></div>
  </div>

  <div class="fit-main" id="fit-main" style="grid-template-columns:minmax(0,62fr) minmax(0,38fr)">

    <!-- ============ 左欄:圖區 ============ -->
    <section class="fit-panel" aria-labelledby="chart-title">
      <div class="fit-panel-head">
        <div id="chart-title" style="min-width:0"></div>
        <div style="display:flex;align-items:center;gap:var(--s-3);flex:none">
          <div class="bench-line" id="chart-legend"></div>
          <button class="chart-x" id="chart-back" hidden title="返回淨值走勢" aria-label="返回淨值走勢">✕</button>
        </div>
      </div>
      <div class="fit-panel-body" style="overflow:hidden;display:flex;flex-direction:column;position:relative">
        <div class="chart-box" id="main-chart" style="flex:1 1 auto;min-height:0"></div>
        <div class="hovcard" id="hovcard" hidden aria-hidden="true"></div>
      </div>
    </section>

    <!-- ============ 右欄:一張卡,兩個分頁 ============ -->
    <section class="fit-panel" aria-label="運行數字">
      <div class="tabs" role="tablist" aria-label="右欄內容">
        <button class="tab-btn" role="tab" id="tab-m" aria-selected="true" aria-controls="p-m">指標</button>
        <button class="tab-btn" role="tab" id="tab-t" aria-selected="false" aria-controls="p-t">逐筆交易</button>
      </div>
      <div class="fit-panel-body" id="right-body">

        <div class="tab-panel" id="p-m" role="tabpanel" aria-labelledby="tab-m">
          <div class="mgrid" id="kpis"></div>
          <p class="section-note" id="metrics-note" style="padding:0 var(--s-3) var(--s-3)"></p>
        </div>

        <div class="tab-panel" id="p-t" role="tabpanel" aria-labelledby="tab-t" hidden>
          <div id="trades-table"></div>
        </div>

      </div>
    </section>

  </div>

  <div id="foot-host"></div>
</main>

<script src="/static/vendor/lightweight-charts.standalone.production.js"></script>
<script src="/static/app.js" charset="utf-8"></script>
<script src="/static/run-view.js" charset="utf-8"></script>
</body>
</html>
