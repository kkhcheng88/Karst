<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>運行詳情 — Karst</title>
<link rel="stylesheet" href="/static/style.css">
<style>
/* ============================================================
   運行詳情頁專用(KARST-053)
   ------------------------------------------------------------
   只有這一頁用得著,而 style.css 此刻同時有另外兩頁在改,所以先住在這裡。
   兩頁收檔之後應搬回 style.css,本段連同註解一併移走。
   ============================================================ */

/* 運行選單改為顯示「策略・參數集・期間・跑於日期」(不再顯示運行編號):
   標籤以中文為主,等寬字體排中文會鬆一格一格,改回內文字體。 */
.runpick button.rp-run { font-family: var(--font-sans); white-space: normal; text-align: left; }
.runpick button.rp-run .rp-when { font-family: var(--font-mono); }

/* 圖例每項可點:點一下收起該條線,再點放回來(QQQ／SPY／策略淨值皆可)。
   用真按鈕,鍵盤 Tab 到、Enter 按得到;aria-pressed 講出這一刻是開還是關。 */
#chart-legend button {
  appearance: none; border: 0; background: transparent; color: inherit;
  font: inherit; padding: 0; margin: 0; cursor: pointer;
  display: inline-flex; align-items: center; gap: var(--s-1);
  border-radius: var(--r-1);
}
#chart-legend button:hover { color: var(--text-1); }
#chart-legend button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
#chart-legend button[aria-pressed="false"] { opacity: .4; text-decoration: line-through; }

/* ---- 重跑彈窗的參數格(KARST-052)---- */
/* 同一個理由住在這裡:style.css 此刻有另外兩頁在改。兩頁收檔即連本段搬回去。 */
.rr-grid {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--s-2) var(--s-4); margin: var(--s-4) 0;
}
.rr-cell { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.rr-cell > label { font-size: var(--fs-xs); color: var(--text-3); }
.rr-cell input, .rr-cell select {
  appearance: none; background: var(--bg-2); color: var(--text-1);
  border: 1px solid var(--line); border-radius: var(--r-1);
  padding: 4px var(--s-2); min-width: 0;
  font-family: var(--font-mono); font-size: var(--fs-xs);
}
.rr-cell input:focus-visible, .rr-cell select:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
/* 改動過的那一格自己講出來:一眼見到這次與當前運行差在哪 */
.rr-cell.is-changed > label { color: var(--accent); }
.rr-cell.is-changed input { border-color: var(--accent); }
.rr-facts { font-size: var(--fs-xs); color: var(--text-3); margin-top: var(--s-2); }
.rr-facts b { color: var(--text-2); font-weight: 400; font-family: var(--font-mono); }
</style>
</head>
<body class="fit">

<div id="nav-host"></div>

<main class="wrap">

  <header class="page-head">
    <div class="page-head-row">
      <div>
        <div class="page-title-group">
          <h1>運行詳情</h1>
          <span class="page-en mono" id="bc-run"></span>
        </div>
        <p class="page-sub">左邊看圖、右邊看數。滑鼠停在曲線任何一日,即見當日的買賣;點下去右邊跳到那幾筆。點一筆交易,左邊換成該實體的蠟燭圖。</p>
      </div>
    </div>
  </header>

  <!-- ============ 檢視運行:揀哪一次,整頁跟著換 ============ -->
  <div class="sp-runbar">
    <span class="sp-runbar-k">檢視運行</span>
    <div class="runpick" id="run-pick" role="group" aria-label="檢視哪一次運行"></div>
    <button class="btn" id="rerun-open" style="margin-left:auto" hidden>以現版本重跑</button>
  </div>

  <!-- ============================================================
       以現版本重跑(KARST-052)。彈窗照 KARST-015 原型 run.html 那一個:
       同一個標題、同一段血統說明、同一塊 .lineage。
       參數每格預填**當前運行的取值**——那是當前值,不是預設值:碼裡與畫面上
       都不留任何一個參數預設值(D-008 第 3 條)。
       ============================================================ -->
  <dialog class="modal" id="rerun-modal" aria-labelledby="rerun-title">
    <div class="modal-body">
      <div class="modal-title" id="rerun-title">以現版本重跑</div>
      <div id="rerun-body"></div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="rerun-cancel">取消</button>
      <button class="btn btn-primary" id="rerun-go">開始重跑</button>
    </div>
  </dialog>

  <div class="fit-main" id="fit-main" style="grid-template-columns:minmax(0,62fr) minmax(0,38fr)">

    <!-- ============ 左欄:圖區 ============ -->
    <section class="fit-panel" aria-labelledby="chart-title">
      <div class="fit-panel-head">
        <div id="chart-title" style="min-width:0"></div>
        <div style="display:flex;align-items:center;gap:var(--s-3);flex:none">
          <div class="bench-line" id="chart-legend"></div>
          <button class="chart-x" id="chart-back" hidden title="返回淨值走勢" aria-label="返回淨值走勢">✕</button>
        </div>
      </div>

      <!-- ============ 檢視視窗:揀一段日期重看,是重看不是重跑 ============ -->
      <div class="fit-panel-head winbar">
        <div class="winpick">
          <label for="win-from">檢視視窗</label>
          <div class="date-switch" id="win-pick" role="group" aria-label="檢視視窗預設段"></div>
          <input class="sp-date" type="date" id="win-from" aria-label="視窗起始日">
          <span class="dim">至</span>
          <input class="sp-date" type="date" id="win-to" aria-label="視窗結束日">
        </div>
        <span class="slim-win" id="win-state"></span>
      </div>
      <div class="fit-panel-body" style="overflow:hidden;display:flex;flex-direction:column;position:relative">
        <div class="chart-box" id="main-chart" style="flex:1 1 auto;min-height:0"></div>
        <div class="hovcard" id="hovcard" hidden aria-hidden="true"></div>
      </div>
    </section>

    <!-- ============ 右欄:一張卡,兩個分頁 ============ -->
    <section class="fit-panel" aria-label="運行數字">
      <div class="tabs" role="tablist" aria-label="右欄內容">
        <button class="tab-btn" role="tab" id="tab-m" aria-selected="true" aria-controls="p-m">指標</button>
        <button class="tab-btn" role="tab" id="tab-t" aria-selected="false" aria-controls="p-t">逐筆交易</button>
      </div>
      <div class="fit-panel-body" id="right-body">

        <div class="tab-panel" id="p-m" role="tabpanel" aria-labelledby="tab-m">
          <div class="mgrid" id="kpis"></div>
          <p class="section-note" id="metrics-note" style="padding:0 var(--s-3) var(--s-3)"></p>
        </div>

        <div class="tab-panel" id="p-t" role="tabpanel" aria-labelledby="tab-t" hidden>
          <div id="trades-table"></div>
        </div>

      </div>
    </section>

  </div>

  <div id="foot-host"></div>
</main>

<script src="/static/vendor/lightweight-charts.standalone.production.js"></script>
<script src="/static/app.js" charset="utf-8"></script>
<script src="/static/run-view.js" charset="utf-8"></script>
</body>
</html>
